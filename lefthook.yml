# lefthook.yml — nself/ntask (React Native Expo + nSelf backend)
# Install: brew install lefthook && lefthook install (at repo root)

pre-commit:
  parallel: true
  commands:
    mobile-typecheck:
      glob: "apps/mobile/**/*.{ts,tsx}"
      run: cd apps/mobile && pnpm typecheck
    mobile-lint:
      glob: "apps/mobile/**/*.{ts,tsx}"
      run: cd apps/mobile && pnpm lint
    secrets-scan:
      run: |
        gitleaks protect --staged --config .gitleaks.toml

pre-push:
  parallel: false
  commands:
    mobile-test:
      run: cd apps/mobile && pnpm test
    mobile-typecheck-full:
      run: cd apps/mobile && pnpm typecheck
