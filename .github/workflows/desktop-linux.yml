name: Desktop Linux Build

on:
  push:
    branches: [main]
    tags: ['ntask-v*']
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'web/ntask/**'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64-unknown-linux-gnu)
    # Needs NSELF_PACKAGES_TOKEN (private packages checkout) — unavailable to
    # dependabot-triggered runs, which only see Dependabot secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No version input: resolved from root package.json "packageManager"
      # (a mismatched pin is a hard error from pnpm/action-setup v6 on).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Required Tauri 2 system dependencies for Linux.
      # libayatana-appindicator3-dev: tray icon (runtime: libayatana-appindicator3-1).
      # libwebkit2gtk-4.1-dev: Tauri 2 webview (webkit2gtk 4.1 — NOT 4.0).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-linux-x86_64-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-linux-x86_64-

      # @nself/* workspace packages live in nself-org/packages (private).
      # Must check out adjacent so pnpm workspace links resolve.
      - name: Checkout @nself packages
        uses: actions/checkout@v4
        with:
          repository: nself-org/packages
          token: ${{ secrets.NSELF_PACKAGES_TOKEN }}
          path: _nself_packages

      - name: Symlink packages to sibling path expected by pnpm workspace
        run: |
          PARENT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          ln -s "$GITHUB_WORKSPACE/_nself_packages" "$PARENT_DIR/packages"

      - name: Install pnpm deps (workspace root)
        run: pnpm install --frozen-lockfile

      # Tauri frontendDist is ../../../../web/ntask/dist relative to apps/desktop/src-tauri —
      # i.e. the SIBLING web repo's dist in the local ~/Sites/nself layout. In CI that
      # resolves to $GITHUB_WORKSPACE/../web/ntask/dist (one level ABOVE the checkout),
      # same parent dir the packages symlink step already uses. Create the placeholder
      # THERE, not repo-relative web/ntask/dist (which Tauri never reads).
      - name: Create web/ntask dist placeholder
        run: mkdir -p "$GITHUB_WORKSPACE/../web/ntask/dist" && echo '<!DOCTYPE html><html><body>ɳTask</body></html>' > "$GITHUB_WORKSPACE/../web/ntask/dist/index.html"

      - name: Clippy check
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Headless smoke test (AppImage)
        run: |
          APPIMAGE=$(find apps/desktop/src-tauri/target/release/bundle/appimage \
            -name '*.AppImage' | head -1)
          if [[ -f "$APPIMAGE" ]]; then
            chmod +x "$APPIMAGE"
            # Brief launch — verify binary executes (headless, exits immediately).
            timeout 5 "$APPIMAGE" --no-sandbox || true
            echo "AppImage smoke test: $APPIMAGE"
          else
            echo "No AppImage found — listing bundle dir:"
            find apps/desktop/src-tauri/target/release/bundle -type f | head -20
          fi

      - name: Upload AppImage + deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
