name: Lighthouse CI

# Disabled: Flutter web target removed — web SaaS is React 19 + Vite 6 SPA (apps/web/).
# Re-enable via Epic G (performance/PWA audit) when apps/web/ has a hosted preview URL.
# Lighthouse is applicable to the Vite SPA; re-wire with @lhci/cli when ready.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lighthouse-ci.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/lighthouse-ci.yml']
  workflow_dispatch:

jobs:
  lighthouse-ci:
    name: Lighthouse CI (disabled — Epic G)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lighthouse CI not applicable until apps/web/ has a hosted preview URL. Re-enable in Epic G."
