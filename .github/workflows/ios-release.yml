# ɳTask iOS Release — EAS Build + Submit
# Trigger: tag push matching ntask/v*
# EXTERNAL GATES: Apple Developer account, ASC API Key, EAS_TOKEN GitHub secret
# See C-S8-T1 for credential provisioning steps.
name: iOS Release (EAS)

on:
  push:
    tags:
      - 'ntask/v*'
  workflow_dispatch:

jobs:
  ios-build:
    name: EAS iOS Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.30.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: EAS Build (iOS production)
        run: eas build --platform ios --profile production --non-interactive

      - name: EAS Submit (iOS)
        if: success()
        run: eas submit --platform ios --profile production --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
