# ɳTask Android Release — EAS Build + Submit
# Trigger: tag push matching ntask/v*
# EXTERNAL GATES: Google Play service account, keystore via EAS managed credentials, EAS_TOKEN
# See C-S8-T2 for credential provisioning steps.
name: Android Release (EAS)

on:
  push:
    tags:
      - 'ntask/v*'
  workflow_dispatch:

jobs:
  android-build:
    name: EAS Android Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.30.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: EAS Build (Android production)
        run: eas build --platform android --profile production --non-interactive

      - name: EAS Submit (Android)
        if: success()
        run: eas submit --platform android --profile production --non-interactive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
