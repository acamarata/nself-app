# ɳTask Android Release — EAS Build + Submit
# Trigger: tag push matching ntask/v*
# EXTERNAL GATES: Google Play service account, keystore via EAS managed credentials, EAS_TOKEN
# See C-S8-T2 for credential provisioning steps.
name: Android Release (EAS)

on:
  push:
    tags:
      - 'ntask/v*'
  workflow_dispatch:

jobs:
  android-build:
    name: EAS Android Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.30.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: EAS Build (Android production)
        run: eas build --platform android --profile production --non-interactive

      - name: Verify Digital Asset Links fingerprint
        if: success()
        run: |
          echo "Checking https://task.nself.org/.well-known/assetlinks.json for a real signing fingerprint..."
          COUNT=$(curl -fsSL https://task.nself.org/.well-known/assetlinks.json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(String((j[0]?.target?.sha256_cert_fingerprints||[]).length))})')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::sha256_cert_fingerprints is empty in production assetlinks.json (web/ntask/public/.well-known/assetlinks.json)."
            echo "::error::A signed Android build must not ship until the release keystore's SHA-256 cert fingerprint is populated there — deep links would silently fall back to the browser. See web/ntask/public/.well-known/README.md."
            exit 1
          fi
          echo "OK: $COUNT fingerprint(s) present."

      - name: EAS Submit (Android)
        if: success()
        run: eas submit --platform android --profile production --non-interactive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
