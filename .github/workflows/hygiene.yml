name: Hygiene

# Consolidates the trivial, no-toolchain repo gates into one workflow with a
# single checkout, so a push doesn't queue three separate near-instant jobs
# for three separate runners.
#
# clean-root.yml and gitleaks.yml are DELIBERATELY NOT folded in here, even
# though clean-root is exactly this class of job. Both are required
# branch-protection checks ("clean-root" and "gitleaks") and GitHub matches
# a required check by job name/id — moving either job into a shared
# workflow file is a legitimate way to preserve the name, but the safer
# choice for two checks branch protection depends on every PR is to leave
# them as their own standalone workflow files untouched. Neither is touched
# by this change.
#
# Trigger scope is the union of the three originals — generated-file-gate
# and multi-arch-check ran on push/pull_request[main] only (multi-arch-check
# also allowed workflow_dispatch), doc-sync ran on pull_request
# [opened, synchronize, reopened] with no branch restriction (the bare
# `pull_request:` default below covers the same three types). Union is
# broader, never narrower, so nothing that used to run stops running. The
# doc-sync steps are guarded to PR events only (the script reads
# github.base_ref, which push events don't set).
#
# nself-first-check.yml is deliberately NOT folded in — it's already scoped
# to `paths: ['**/docker-compose*.yml', ...]` and fires on almost no
# pushes. Merging it into a workflow that must run on every push would make
# it run far more often, which is the opposite of the goal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── from generated-file-gate.yml ─────────────────────────────
      - name: Scan diff for GENERATED BY markers
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            BASE="origin/main"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="HEAD~1"
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n 5 "$f" | grep -q "# GENERATED BY"; then
              if git check-ignore -q "$f"; then
                echo "OK: $f is generated but gitignored."
              else
                echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
                echo "  -> $f"
                FAIL=1
              fi
            fi
          done <<< "$CHANGED"

          if [ "$FAIL" -eq 1 ]; then
            echo "ERROR: Refusing to commit generated file. Add to .gitignore first."
            exit 1
          fi

          echo "Generated File Gate: clean."

      # ── from multi-arch-check.yml ────────────────────────────────
      - name: Multi-arch check (N/A)
        run: |
          echo "Repo type: TypeScript app surfaces (RN/Expo, Vite, Tauri, rn-tvos) + nSelf backend"
          echo "No Go binaries or Docker images produced. Multi-arch check N/A. PASS."

      # ── from doc-sync.yml — PR-only, needs github.base_ref ───────
      - name: Compute PR diff
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$changed"

      - name: Doc-Sync matrix check
        if: github.event_name == 'pull_request'
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -u
          missing=0
          rows=""

          matches() {
            echo "$CHANGED" | grep -qE "$1"
          }

          # Commands / flags
          if matches '^cli/(cmd|internal/commands)/'; then
            if ! matches '^(cli/\.wiki/commands/|\.claude/docs/sport/F02-COMMAND-INVENTORY\.md|\.claude/docs/reference/cli-commands\.md|web/docs/content/cli/)'; then
              rows="${rows}- commands/flags changed without cli/.wiki/commands/ or F02-COMMAND-INVENTORY.md update\n"
              missing=1
            fi
          fi

          # Env vars — only fire when actual variable names (not comments) changed.
          env_var_changed=0
          if matches '^cli/internal/env/'; then
            env_var_changed=1
          fi
          if matches '(^|/)\.env\.example$'; then
            # Check if actual VAR= lines changed (not comment-only changes)
            if git diff "origin/${{ github.base_ref }}"...HEAD -- '*/.env.example' '.env.example' 2>/dev/null | grep -qE '^\+[A-Z_]+='; then
              env_var_changed=1
            fi
          fi
          if [ "$env_var_changed" -eq 1 ]; then
            if ! matches '(\.claude/docs/sport/F09-ENV-VAR-INVENTORY\.md|cli/\.wiki/reference/env-vars\.md|web/docs/content/reference/env-vars|\.github/wiki/Environment-Variables\.md)'; then
              rows="${rows}- env vars changed without F09-ENV-VAR-INVENTORY.md or env-vars reference update\n"
              missing=1
            fi
          fi

          # API endpoints
          if matches '^web/backend/services/|^web/backend/.*/metadata/'; then
            if ! matches '(web/docs/content/api/|\.claude/docs/API-Reference\.md|\.claude/docs/sport/F08-SERVICE-INVENTORY\.md)'; then
              rows="${rows}- API endpoints changed without web/docs/content/api/ or F08-SERVICE-INVENTORY.md update\n"
              missing=1
            fi
          fi

          # UI pages
          if matches '^(admin/app/|web/[^/]+/src/app/)'; then
            if ! matches '(admin/\.wiki/|web/docs/content/|\.github/docs/|\.github/wiki/)'; then
              rows="${rows}- UI pages changed without matching .wiki/ or web/docs/content/ update\n"
              missing=1
            fi
          fi

          # Pricing / tiers
          if matches '^(web/org/content/(pricing|membership)/|web/org/src/.*(pricing|tier)|plugins-pro/.*/tier)'; then
            if ! matches '(\.claude/docs/sport/F07-PRICING-TIERS\.md|\.claude/docs/membership/|web/org/content/(pricing|membership)/)'; then
              rows="${rows}- pricing/tiers changed without F07-PRICING-TIERS.md or membership docs update\n"
              missing=1
            fi
          fi

          # Plugins / bundles
          if matches '^(plugins|plugins-pro)/[^/]+/'; then
            if ! matches '(\.claude/docs/sport/F0[346]-|plugins/README\.md|plugins-pro/README\.md|web/org/content/plugins/|web/docs/content/plugins/)'; then
              rows="${rows}- plugins/bundles changed without F03/F04/F06 or README or web/*/content/plugins/ update\n"
              missing=1
            fi
          fi

          # Ports / subdomains
          if matches '^(nginx/|.*docker-compose\.ya?ml$)'; then
            if ! matches '(\.claude/docs/sport/F10-PORT-REGISTRY\.md|\.claude/docs/sport/F11-SUBDOMAIN-MAP\.md|\.claude/CLAUDE\.md)'; then
              rows="${rows}- ports/subdomains changed without F10-PORT-REGISTRY.md or F11-SUBDOMAIN-MAP.md update\n"
              missing=1
            fi
          fi

          # Versions — only fire when the actual version string changed.
          # pubspec.yaml changes that only add/remove dependencies (not the version: line)
          # should not require a MASTER-VERSIONS.md update.
          version_bump=0
          if matches '^cli/VERSION$|plugins-pro/VERSION$'; then
            version_bump=1
          fi
          if matches 'homebrew-nself/.*\.rb$'; then
            version_bump=1
          fi
          if matches '^Cargo\.toml$'; then
            if git diff "origin/${{ github.base_ref }}"...HEAD -- Cargo.toml | grep -qE '^\+\s*version\s*='; then
              version_bump=1
            fi
          fi
          if matches 'apps/mobile/package\.json$'; then
            if git diff "origin/${{ github.base_ref }}"...HEAD -- apps/mobile/package.json | grep -qE '^\+"version":'; then
              version_bump=1
            fi
          fi
          if [ "$version_bump" -eq 1 ]; then
            if ! matches '(\.claude/docs/MASTER-VERSIONS\.md|\.claude/docs/sport/F01-MASTER-VERSIONS\.md|web/org/content/changelog|homebrew-nself/Formula/)'; then
              rows="${rows}- version files changed without MASTER-VERSIONS.md or F01 update\n"
              missing=1
            fi
          fi

          if [ "$missing" -eq 1 ]; then
            echo "::error::Doc-Sync Ritual violations detected"
            printf '%b' "$rows"
            echo ""
            echo "Doctrine: .claude/docs/doctrines/doc-sync-ritual.md"
            echo "Matrix:   .claude/qa/pre-commit.md"
            exit 1
          fi

          echo "Doc-Sync Ritual: all surface changes have matching doc updates."
