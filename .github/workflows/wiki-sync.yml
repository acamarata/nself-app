name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - '.github/wiki/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync to Wiki
        # Wiki initialized — continue-on-error removed (P5 Epic G T10).
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .github/wiki/
          strategy: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAIL: ${{ github.actor }}@users.noreply.github.com
          GH_NAME: ${{ github.actor }}
