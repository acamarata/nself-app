name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - '.github/wiki/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync to Wiki
        # ACCEPTED: wiki repo is only created by GitHub after the first page is saved via the web UI.
        # Until initialized (visit https://github.com/nself-org/ntask/wiki and save), pushes fail with
        # "repository not found". Remove this flag once the wiki is initialized.
        # Expiry: remove after wiki is initialized — it will then stay in sync automatically.
        continue-on-error: true
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .github/wiki/
          strategy: init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MAIL: ${{ github.actor }}@users.noreply.github.com
          GH_NAME: ${{ github.actor }}
