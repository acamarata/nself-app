name: Desktop macOS Build

on:
  # Called by desktop-release.yml for tagged releases. Without workflow_call the
  # orchestrator cannot reference this file at all and fails to parse.
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    # Needs NSELF_PACKAGES_TOKEN (private packages checkout) — unavailable to
    # dependabot-triggered runs, which only see Dependabot secrets.
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 (last Intel runner image) is retired — jobs queue forever.
          # Cross-compile the x86_64 slice on Apple Silicon instead (rustup target
          # + `tauri build --target` handle this natively).
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No version input: resolved from root package.json "packageManager"
      # (a mismatched pin is a hard error from pnpm/action-setup v6 on).
      - name: Checkout shared @nself packages (sibling workspace dir)
        shell: bash
        # pnpm-workspace.yaml includes ../packages/@nself/* — a sibling repo that
        # CI never checked out, so @nself/* workspace deps were unresolvable (TS2307).
        working-directory: '.'
        run: |
          rm -rf ../packages
          git clone --depth 1 https://x-access-token:${{ secrets.NSELF_PACKAGES_TOKEN }}@github.com/nself-org/packages.git ../packages

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-macos-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-macos-${{ matrix.target }}-

      # @nself/* workspace packages live in nself-org/packages (private).
      # Must check out adjacent so pnpm workspace links resolve.
      - name: Checkout @nself packages
        uses: actions/checkout@v4
        with:
          repository: nself-org/packages
          token: ${{ secrets.NSELF_PACKAGES_TOKEN }}
          path: _nself_packages

      - name: Symlink packages to sibling path expected by pnpm workspace
        run: |
          PARENT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          ln -s "$GITHUB_WORKSPACE/_nself_packages" "$PARENT_DIR/packages"

      - name: Install sibling packages deps (their own lockfile)
        shell: bash
        # app typecheck walks into ../packages/@nself/* source, which imports
        # third-party deps resolved by the packages repo's OWN lockfile
        working-directory: '.'
        run: pnpm install --frozen-lockfile --dir ../packages

      - name: Install pnpm deps (workspace root)
        run: pnpm install --frozen-lockfile

      # Tauri frontendDist is ../../../../web/ntask/dist from apps/desktop/src-tauri —
      # in CI that is $GITHUB_WORKSPACE/../web/ntask/dist (ABOVE the checkout). Create
      # the placeholder there, not repo-relative web/ntask/dist (Tauri never reads it).
      - name: Create web/ntask dist placeholder
        run: mkdir -p "$GITHUB_WORKSPACE/../web/ntask/dist" && echo '<!DOCTYPE html><html><body>ɳTask</body></html>' > "$GITHUB_WORKSPACE/../web/ntask/dist/index.html"

      - name: Clippy check
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Import Apple cert (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          # Real signing identity only on tag builds (the cert-import step above is
          # tag-gated, so the cert is only in the keychain then). PR/main builds
          # ad-hoc sign ('-') — otherwise codesign fails with "item not found in keychain".
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Verify codesign (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for app in apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app" || true
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30

  notarize:
    name: Notarize (${{ matrix.target }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-${{ matrix.target }}
          path: artifacts/

      # Notarization supports two auth methods. The App Store Connect API key is
      # preferred: it does not expire the way app-specific passwords do, it is not
      # tied to one person's Apple ID (so it survives staff changes), and it is the
      # documented path for organization publishing. If the API-key secrets are
      # absent we fall back to Apple ID + app-specific password.
      #
      # App-specific passwords are ALWAYS formatted abcd-efgh-ijkl-mnop (16 lowercase
      # letters, four hyphenated groups). Anything else is not an app-specific
      # password and Apple will reject it with HTTP 401 — validate before trusting it:
      #   xcrun notarytool history --apple-id <id> --password <asp> --team-id <team>
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_API_KEY_P8:-}" ]]; then
            echo "Notarizing with App Store Connect API key (${APPLE_API_KEY_ID})"
            KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            auth_args=(--key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            echo "Notarizing with Apple ID + app-specific password"
            auth_args=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          fi

          for dmg in artifacts/*.dmg; do
            [[ -f "$dmg" ]] || continue
            xcrun notarytool submit "$dmg" "${auth_args[@]}" --wait
            xcrun stapler staple "$dmg"
          done

          [[ -n "${APPLE_API_KEY_P8:-}" ]] && rm -f "$KEY_FILE" || true

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.target }}-notarized
          path: artifacts/*.dmg
          retention-days: 30
