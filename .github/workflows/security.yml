name: Security Scan

# Retargeted from app/pubspec.lock (Flutter) to apps/mobile/pnpm-lock.yaml (React Native Expo)
# after mega-p1/rn-migration. OSV Scanner supports pnpm lockfiles natively.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/pnpm-lock.yaml'
      - 'apps/mobile/package.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/pnpm-lock.yaml'
      - 'apps/mobile/package.json'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: OSV Scanner — pnpm lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=apps/mobile/pnpm-lock.yaml
