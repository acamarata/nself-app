name: Security Scan

# Retargeted from app/pubspec.lock (Flutter) to apps/mobile/pnpm-lock.yaml (React Native Expo)
# after mega-p1/rn-migration. OSV Scanner supports pnpm lockfiles natively.

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'apps/mobile/package.json'
      - '.github/workflows/security.yml'
      - 'apps/mobile/osv-scanner.toml'
  pull_request:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - 'apps/mobile/package.json'
      - '.github/workflows/security.yml'
      - 'apps/mobile/osv-scanner.toml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: OSV Scanner — root workspace lockfile
        # Scan the root pnpm-lock.yaml (apps/mobile is a workspace package).
        # The root lockfile applies overrides for form-data, js-yaml, tar (see pnpm.overrides
        # in package.json). apps/mobile/pnpm-lock.yaml is a stale standalone lockfile and
        # does not benefit from workspace-level overrides.
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --config=apps/mobile/osv-scanner.toml
