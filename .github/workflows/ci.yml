name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-check:
    name: nself CLI Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install nself CLI
        env:
          NSELF_VERSION: "1.1.4"  # Pin: update when cli/VERSION is bumped. Source of truth: .claude/docs/MASTER-VERSIONS.md
        run: |
          curl -fsSL https://raw.githubusercontent.com/nself-org/cli/main/.github/install.sh | bash
          echo "$HOME/.nself/bin" >> $GITHUB_PATH

      - name: Verify nself CLI
        run: |
          nself version
          nself help
  version-lockstep:
    name: Version Lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check version lockstep
        run: bash scripts/check-version-lockstep.sh

  web-test:
    name: Web Tests (typecheck + unit + build)
    # Shared packages come from a public clone (see mobile-test), so this job
    # needs no secret and runs on dependabot PRs like any other.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm-workspace.yaml resolves packages/@nself/* from a clone inside the repo
      # and packages/@nself-web/* from that same clone.
      - name: Checkout shared @nself packages (sibling workspace dir)
        shell: bash
        working-directory: '.'
        run: |
          rm -rf packages
          git clone --depth 1 https://github.com/nself-org/packages.git packages

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck walks into packages/**/src, whose imports (react,
      # @vercel/og) resolve from that repo's OWN node_modules. It is a sibling,
      # not an ancestor, so it cannot reach this workspace's hoisted modules.
      - name: Install sibling packages deps (their own lockfile)
        shell: bash
        working-directory: '.'
        run: pnpm install --no-frozen-lockfile --dir packages

      # The packages expose types through their exports map, which points at
      # dist/. Without building them TypeScript cannot resolve @nself-web/ui or
      # @nself-web/og and reports TS2307 for every import.
      - name: Build shared packages
        shell: bash
        working-directory: '.'
        run: pnpm --dir packages -r build

      # Vercel runs `pnpm build`, which is vite build alone — typechecking the
      # app there would need the sibling packages' own devDependencies, which
      # are not in this repo's lockfile. So it is gated here instead.
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Unit tests
        working-directory: web
        run: pnpm test

      - name: Production build
        working-directory: web
        run: pnpm build

      # The web monorepo enforced a bundle budget; that was left behind when the
      # app moved here, so nothing has watched bundle size since. Current total
      # is ~385 kB gzipped against a 400 kB gate — the gate exists to stop
      # regression, not to certify the size. The org target for a SaaS surface
      # is 300 kB, tracked separately as a reduction ticket.
      - name: Bundle budget
        working-directory: web
        run: pnpm size

  mobile-test:
    name: Mobile Tests (coverage gate ≥60%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ONE mechanism for the shared packages, everywhere: a plain public clone.
      # nself-org/packages is public, so the private-token checkout this job used
      # to do first was both unnecessary and dead — the very next step deleted
      # the symlink it created (`rm -rf packages`). That token was also the only
      # reason this job skipped dependabot runs, so that gate is gone too and
      # dependabot PRs now get the same coverage gate as everyone else.
      - name: Checkout shared @nself packages (sibling workspace dir)
        shell: bash
        # pnpm-workspace.yaml resolves packages/@nself/* from a clone inside the repo
        # CI never checked out, so @nself/* workspace deps were unresolvable (TS2307).
        working-directory: '.'
        run: |
          rm -rf packages
          git clone --depth 1 https://github.com/nself-org/packages.git packages

      - uses: pnpm/action-setup@v6
        with:
          version: '10.30.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Install sibling packages deps (their own lockfile)
        shell: bash
        # app typecheck walks into packages/@nself/* source, which imports
        # third-party deps resolved by the packages repo's OWN lockfile
        working-directory: '.'
        run: pnpm install --frozen-lockfile --dir packages

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - name: Run mobile tests with coverage gate
        # Coverage threshold (lines ≥60%, branches ≥50%) is configured in jest.config.js.
        # N-S3-T5: failing here means coverage dropped below the gate — fix coverage, not the threshold.
        run: pnpm test --coverage
        working-directory: apps/mobile

  # ── CI-1: suites that existed but no workflow ever invoked ──────────────────
  # backend/functions/__tests__, apps/cli/test and apps/mcp/test were all real,
  # all passing locally, and all invisible to CI — the repo's own documented
  # failure class (a green total that measured nothing). Each job below fails if
  # its suite reports zero tests, so "the suite silently stopped running" cannot
  # look like success a second time.
  backend-functions-test:
    name: Backend Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install
        working-directory: backend/functions
        run: npm ci
      - name: Typecheck
        working-directory: backend/functions
        run: npm run typecheck
      - name: Test
        working-directory: backend/functions
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/functions-test.log
          # node:test's spec reporter prints a coloured "ℹ pass N" summary line.
          # Zero passing tests means the suite did not run, which must be a
          # failure, not a green tick.
          PASS=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/functions-test.log \
                 | grep -Eo '(^|[^a-z])pass [0-9]+' | tail -1 | grep -Eo '[0-9]+')
          PASS="${PASS:-0}"
          echo "backend/functions passing tests: $PASS"
          [ "$PASS" -gt 0 ] || { echo 'ERROR: suite reported no passing tests'; exit 1; }

  cli-mcp-test:
    name: ${{ matrix.pkg }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pkg: [apps/cli, apps/mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared @nself packages (sibling workspace dir)
        run: |
          rm -rf packages
          git clone --depth 1 https://github.com/nself-org/packages.git packages
      - uses: pnpm/action-setup@v6
        with:
          version: '10.30.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: ${{ matrix.pkg }}
        run: pnpm typecheck
      - name: Build
        working-directory: ${{ matrix.pkg }}
        run: pnpm build
      - name: Test
        working-directory: ${{ matrix.pkg }}
        # vitest exits non-zero when it finds no test files, and --passWithNoTests
        # is deliberately NOT used: a vanished suite must go red.
        run: pnpm test

  i18n-completeness:
    name: I18n Completeness Gate (N-S3-T3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install tsx
        run: npm install -g tsx
      - name: Check i18n key completeness (mobile + web; TV skipped until F-S2-T6)
        # Exits non-zero and lists missing keys if any target locale (ar/fr/es) is
        # missing a key present in the English (en) baseline. N-S3-T3.
        run: tsx scripts/check-i18n-completeness.ts
