name: Desktop Windows Build

# Replaces the dead stub that had `if: false` EV signing and no real build.
# EV signing is conditional: only runs if SSL_COM_USERNAME secret is set.
# Without EV cert, MSI ships unsigned — SmartScreen warns until reputation builds.
# Reference: E-desktop-tauri.md PROC-2 for EV cert procurement details.

on:
  push:
    branches: [main]
    tags: ['ntask-v*']
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'web/ntask/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    # Needs NSELF_PACKAGES_TOKEN (private packages checkout) — unavailable to
    # dependabot-triggered runs, which only see Dependabot secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No version input: resolved from root package.json "packageManager"
      # (a mismatched pin is a hard error from pnpm/action-setup v6 on).
      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-windows-x86_64-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-windows-x86_64-

      # @nself/* workspace packages live in nself-org/packages (private).
      # Must check out adjacent so pnpm workspace links resolve.
      - name: Checkout @nself packages
        uses: actions/checkout@v4
        with:
          repository: nself-org/packages
          token: ${{ secrets.NSELF_PACKAGES_TOKEN }}
          path: _nself_packages

      - name: Symlink packages to sibling path expected by pnpm workspace
        shell: bash
        run: |
          # RUNNER_WORKSPACE is e.g. D:\a\ntask on Windows (parent of repo checkout)
          # pnpm-workspace.yaml links ../packages/@nself/* (one level above repo root)
          PARENT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          ln -s "$GITHUB_WORKSPACE/_nself_packages" "$PARENT_DIR/packages"

      - name: Install pnpm deps (workspace root)
        run: pnpm install --frozen-lockfile

      # Tauri frontendDist is ../../../../web/ntask/dist from apps/desktop/src-tauri —
      # in CI that is $GITHUB_WORKSPACE/../web/ntask/dist (ABOVE the checkout). Create
      # the placeholder there, not repo-relative web/ntask/dist (Tauri never reads it).
      - name: Create web/ntask dist placeholder
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/../web/ntask/dist" && echo '<!DOCTYPE html><html><body>Task</body></html>' > "$GITHUB_WORKSPACE/../web/ntask/dist/index.html"

      - name: Build Tauri app
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # EV code-signing via SSL.com eSigner.
      # Only runs when SSL_COM_USERNAME secret is configured (PROC-2 gate).
      # Without EV cert: skip silently — MSI is valid but unsigned.
      - name: Sign Windows MSI (SSL.com EV — conditional)
        if: env.SSL_COM_USERNAME != ''
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          # productName is "nTask" on Windows (tauri.windows.conf.json) — WiX3 light.exe
          # chokes on the non-ASCII ɳ. Keep this path in sync with app version.
          file_path: >-
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/nTask_1.2.0_x64_en-US.msi
          override: true

      - name: Upload MSI + NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
