name: Desktop Windows Build

# Replaces the dead stub that had `if: false` EV signing and no real build.
# EV signing is conditional: only runs if SSL_COM_USERNAME secret is set.
# Without EV cert, MSI ships unsigned — SmartScreen warns until reputation builds.
# Reference: E-desktop-tauri.md PROC-2 for EV cert procurement details.
# Gate: EXTERNAL-GATES.md row "Windows EV/OV code-signing cert (~$300)" (currently OPEN)

on:
  # Called by desktop-release.yml for tagged releases. Without workflow_call the
  # orchestrator cannot reference this file at all and fails to parse.
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # No version input: resolved from root package.json "packageManager"
      # (a mismatched pin is a hard error from pnpm/action-setup v6 on).
      - name: Checkout shared @nself packages (sibling workspace dir)
        shell: bash
        # pnpm-workspace.yaml resolves packages/@nself/* from a clone inside the repo
        # CI never checked out, so @nself/* workspace deps were unresolvable (TS2307).
        working-directory: '.'
        run: |
          rm -rf packages
          git clone --depth 1 https://github.com/nself-org/packages.git packages

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-windows-x86_64-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-windows-x86_64-

      - name: Install sibling packages deps (their own lockfile)
        shell: bash
        # app typecheck walks into packages/@nself/* source, which imports
        # third-party deps resolved by the packages repo's OWN lockfile
        working-directory: '.'
        run: pnpm install --frozen-lockfile --dir packages

      # Types come from dist/ via the exports map; unbuilt packages give TS2307.
      - name: Build shared packages
        shell: bash
        working-directory: '.'
        run: pnpm --dir packages -r build

      - name: Install pnpm deps (workspace root)
        run: pnpm install --frozen-lockfile

      # Tauri frontendDist is ../../../../web/ntask/dist from apps/desktop/src-tauri —
      # in CI that is $GITHUB_WORKSPACE/../web/ntask/dist (ABOVE the checkout). Create
      # the placeholder there, not repo-relative web/ntask/dist (Tauri never reads it).
      - name: Create web/ntask dist placeholder
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/../web/ntask/dist" && echo '<!DOCTYPE html><html><body>Task</body></html>' > "$GITHUB_WORKSPACE/../web/ntask/dist/index.html"

      - name: Build Tauri app
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # EV code-signing via SSL.com eSigner.
      # Only runs when SSL_COM_USERNAME secret is configured (PROC-2 gate).
      # Without EV cert: skip silently — MSI is valid but unsigned.
      # MSI filename is versioned (nTask_<version>_x64_en-US.msi) and the
      # version here must never be hand-maintained — it drifted from the real
      # build output before (hardcoded 1.2.0 while tauri.conf.json had moved
      # on), which made the signing step silently miss the file (a glob with
      # no matches is not a failure by itself) and ship an unsigned MSI.
      - name: Resolve built MSI path
        id: msi
        shell: bash
        run: |
          MSI_DIR="apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          MSI_PATH=$(ls "$MSI_DIR"/nTask_*_x64_en-US.msi 2>/dev/null | head -1)
          if [[ -z "$MSI_PATH" ]]; then
            echo "ERROR: no nTask_*_x64_en-US.msi found in $MSI_DIR"
            ls -la "$MSI_DIR" || true
            exit 1
          fi
          echo "Resolved MSI: $MSI_PATH"
          echo "path=$MSI_PATH" >> "$GITHUB_OUTPUT"

      - name: Sign Windows MSI (SSL.com EV — conditional)
        if: env.SSL_COM_USERNAME != ''
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          # productName is "nTask" on Windows (tauri.windows.conf.json) — WiX3 light.exe
          # chokes on the non-ASCII ɳ. Path resolved above from the actual build
          # output (glob), not hardcoded — a hardcoded version silently drifted
          # from the real build once before, shipping an unsigned MSI.
          file_path: ${{ steps.msi.outputs.path }}
          override: true

      - name: Upload MSI + NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
