name: Mobile CI

# Retargeted from Flutter to React Native Expo (apps/mobile/) after mega-p1/rn-migration.
# Runs lint, typecheck, and unit tests — equivalent coverage to the former flutter analyze + flutter test.
# Native build jobs (Android APK, iOS no-codesign) are handled by android-release.yml and ios-release.yml
# on tag push / workflow_dispatch. Expo prebuild for simulator builds skipped in CI: pnpm
# reactNativeDir resolution breaks with Expo 51 (tracked for expo v52 upgrade).

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Checkout shared @nself packages (sibling workspace dir)
        shell: bash
        # pnpm-workspace.yaml resolves packages/@nself/* from a clone inside the repo
        # CI never checked out, so @nself/ntask-core etc. were unresolvable (TS2307).
        working-directory: '.'
        run: |
          rm -rf packages
          git clone --depth 1 https://github.com/nself-org/packages.git packages

      - uses: pnpm/action-setup@v6
        with:
          # Pin to workspace root packageManager version to avoid "multiple versions" conflict
          version: '10.30.1'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          # Root lockfile is canonical for workspace (apps/mobile is a workspace package)
          cache-dependency-path: pnpm-lock.yaml

      - name: Install sibling packages deps (their own lockfile)
        shell: bash
        # app typecheck walks into packages/@nself/* source, which imports
        # third-party deps resolved by the packages repo's OWN lockfile
        working-directory: '.'
        run: pnpm install --frozen-lockfile --dir packages

      - name: Install dependencies
        # Run from repo root so workspace overrides (form-data, js-yaml) are applied
        working-directory: '.'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
