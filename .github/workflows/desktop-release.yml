name: Desktop Release

# Tag-triggered unified release: builds all 3 OS targets in parallel,
# creates a GitHub Release, and triggers the updater manifest publish.
#
# Trigger: push a tag matching 'v*' (e.g. v1.3.1) — the convention every
# tag in this repo actually uses.
# Use: make tag-desktop (reads version from apps/desktop/src-tauri/tauri.conf.json).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.1)'
        required: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  # ── Version gate ─────────────────────────────────────────────────────────
  version-gate:
    name: Version consistency check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # On dispatch the default ref is the branch, whose version may
          # differ from the tag being released. Check out the tag itself.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Assert tauri.conf.json version matches git tag
        run: |
          # inputs.tag wins when dispatched. GITHUB_REF_NAME is ALWAYS set — it is
          # the branch name on a workflow_dispatch from a branch — so the old
          # "${GITHUB_REF_NAME:-inputs.tag}" could never reach the input, and the
          # gate compared "main" against a semver.
          TAG="${{ inputs.tag }}"
          TAG="${TAG:-$GITHUB_REF_NAME}"
          # Strip the leading 'v' to get semver.
          EXPECTED="${TAG#v}"
          ACTUAL=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          echo "Tag version:    $EXPECTED"
          echo "Conf version:   $ACTUAL"
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "ERROR: tag version ($EXPECTED) does not match tauri.conf.json ($ACTUAL)"
            echo "Bump tauri.conf.json version before tagging."
            exit 1
          fi
          echo "Version gate passed: $ACTUAL"

  # ── Parallel OS builds ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: version-gate
    uses: ./.github/workflows/desktop-macos.yml
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: version-gate
    uses: ./.github/workflows/desktop-linux.yml
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: version-gate
    uses: ./.github/workflows/desktop-windows.yml
    secrets: inherit

  # ── GitHub Release ───────────────────────────────────────────────────────
  publish:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Required by the "Trigger updater manifest publish" step, which calls
      # `gh workflow run publish-updater.yml`. Without it the dispatch fails
      # with HTTP 403 "Resource not accessible by integration" and the whole
      # job goes red even though every build succeeded and every asset uploaded
      # — which is exactly what happened on v1.4.0.
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          # On dispatch the default ref is the branch, whose version may
          # differ from the tag being released. Check out the tag itself.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-artifacts/

      - name: List artifacts
        run: find release-artifacts/ -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # inputs.tag wins when dispatched. GITHUB_REF_NAME is ALWAYS set — it is
          # the branch name on a workflow_dispatch from a branch — so the old
          # "${GITHUB_REF_NAME:-inputs.tag}" could never reach the input, and the
          # gate compared "main" against a semver.
          TAG="${{ inputs.tag }}"
          TAG="${TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # A re-dispatch must be able to finish an incomplete release. The
          # unconditional `gh release create` aborted with "a release with the
          # same tag name already exists", which is exactly what happened on
          # v1.3.1: all four platform builds succeeded, but the release kept the
          # single macOS dmg it had from the first run and the other three
          # artifacts were thrown away with the failed job.
          # Collect real FILES. `release-artifacts/**` without globstar expands
          # to `release-artifacts/*`, which includes directories such as
          # release-artifacts/dmg. `gh release create` tolerated that, but
          # `gh release upload` tries to POST each path and dies with
          #   read release-artifacts/dmg: is a directory
          # so the upload branch has to enumerate files explicitly.
          # Only real distributable installers, and only for THIS version.
          #
          # `find release-artifacts -type f` uploaded every file in the tree. On
          # v1.4.0 that attached 19 assets: the six real installers plus macOS
          # .app bundle internals (CodeResources, Info.plist, icon.icns, the
          # tray-*.png icons, the raw ntask-desktop binary) AND stale
          # nTask_1.3.0/1.3.1 installers left in the artifact directory. Anyone
          # opening the release saw three versions mixed with build debris.
          #
          # Extension allow-list + version match, so a stale artifact from a
          # restored cache cannot ride along again.
          mapfile -t ARTIFACTS < <(
            find release-artifacts -type f \
              \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \
                 -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
                 -o -name "*.app.tar.gz" -o -name "*.sig" \) \
              | grep -F "$VERSION" | sort
          )
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "::error::no files found under release-artifacts/"
            exit 1
          fi
          printf 'Uploading %d artifact(s):\n' "${#ARTIFACTS[@]}"
          printf '  %s\n' "${ARTIFACTS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading artifacts into it."
            gh release upload "$TAG" "${ARTIFACTS[@]}" --clobber
            exit 0
          fi

          gh release create "$TAG" \
            --title "ɳTask Desktop $VERSION" \
            --notes "## ɳTask Desktop v${VERSION}

          See the [Changelog](https://github.com/nself-org/ntask/wiki/Changelog) for details.

          ### Downloads
          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | \`*aarch64.dmg\` |
          | macOS (Intel) | \`*x86_64.dmg\` |
          | Windows x64 | \`*.msi\` or \`*.exe\` |
          | Linux x64 | \`*.AppImage\` or \`*.deb\` |

          ### Auto-update
          Users on v1.0.0+ will be notified automatically.
          " \
            "${ARTIFACTS[@]}"

      - name: Trigger updater manifest publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-updater.yml \
            --field tag="${{ inputs.tag || github.ref_name }}"
