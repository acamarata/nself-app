name: Mobile CI

# Retargeted from Flutter to React Native Expo (apps/mobile/) after mega-p1/rn-migration.
# Runs lint, typecheck, and unit tests — equivalent coverage to the former flutter analyze + flutter test.

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build Android (debug)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

  build-ios:
    name: Build iOS
    runs-on: macos-15
    needs: analyze
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS)
        run: pnpm exec expo prebuild --platform ios --non-interactive

      - name: Build iOS (no codesign)
        run: |
          xcodebuild build \
            -workspace ios/ntaskmobile.xcworkspace \
            -scheme ntaskmobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true
