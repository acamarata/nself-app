# NSELF-FIRST EXCEPTION: d6-any-stack — hand-authored local-dev override, NOT nself build output
#
# Purpose: work around nself CLI gap — `nself build` hardcodes `read_only: true`
# on every generated service (security hardening default), but the functions
# service (nhost/functions:latest running our custom TS handlers) needs a
# writable HOME to create npm/yarn rc files (/root/.nirc) and a writable
# node_modules cache at container start. Without this override the container
# crash-loops with "can't create /root/.nirc: Read-only file system".
#
# This file is plain docker-compose and is picked up automatically by
# `docker compose` (and therefore by `nself start`/`nself stop`, which shell
# out to `docker compose` without explicit `-f` flags for the dev profile —
# see backend/Makefile `up`/`down` targets) whenever it sits next to
# docker-compose.yml. It survives `nself build` regenerating docker-compose.yml
# because it is a separate file that Compose merges at runtime — no hand-edit
# of the generated file required.
#
# CLI gap filed: nself-functions-readonly-fs (nself.yaml has no per-service
# `read_only: false` escape hatch yet). Remove this file once nself build
# supports overriding hardening defaults per-service natively.
#
# Second CLI gap on the same service, same generator bug class, CORRECTED
# 2026-08-24: `nhost/functions:latest`'s bundled start.sh does NOT run this
# project's functions/server.ts. It globs the mounted directory and serves each
# file as its own route on a hardcoded port 3000. Under that runtime NONE of the
# routes this backend declares exist — no /api/actions/*, no /events/*, no
# /cron/* — so every Hasura action, cron and event trigger fails at the network
# layer. Staging ran exactly that way until 2026-08-24: 14 074 cron invocations,
# every one "Connection refused" to functions:3001, silently, for weeks.
# Production worked only because someone had hand-added an `entrypoint` to the
# box's compose file, which is precisely the drift this override exists to stop.
#
# So the override runs the real app itself: `entrypoint` executes
# functions/server.ts, which honours PORT and registers the whole route table.
# The healthcheck and ACTION_HANDLER_URL then follow that same port (3001), and
# the image has no `curl`, so the probe uses wget.
# CLI gap filed: nself-functions-entrypoint-ignored (the compose generator emits
# a functions service that never executes the project's entrypoint; nself.yaml
# needs `services.functions.entrypoint`/`command` support).
services:
  functions:
    # Fifth gap, same generator: `nself build` forwards only a fixed set of env
    # vars into the functions service, so NHOST_WEBHOOK_SECRET — the shared secret
    # that stops anyone who can reach this port from impersonating any user via
    # session_variables.x-hasura-user-id — never arrives. Both this service and
    # hasura (below) must see the SAME value, or every action call 401s.
    # Empty is allowed and means "check disabled" (server.ts warns at boot).
    # CLI gap filed: nself-functions-env-passthrough.
    #
    # Same gap, more casualties (found 2026-08-16 by inspecting the RUNNING
    # container's env: it carried only PORT, DATABASE_URL,
    # HASURA_GRAPHQL_ADMIN_SECRET and HASURA_GRAPHQL_ENDPOINT):
    #
    #   HASURA_AUTH_URL — account-ops.ts and user-delete.ts fell back to their
    #     compiled-in default of `http://auth:4000`, but this stack publishes the
    #     auth container on AUTH_PORT (4000 is held by another local stack), so
    #     every auth call from the functions service hit a closed port. The
    #     handlers now derive the URL from AUTH_PORT (functions/lib/auth-service.ts)
    #     and both vars are forwarded here, so code and compose read one source
    #     of truth instead of two hardcoded numbers that drifted apart.
    #
    #   MINIO_* — storage-presign.ts, user-export.ts and user-delete.ts sign
    #     MinIO requests with SigV4 from MINIO_ACCESS_KEY/MINIO_SECRET_KEY.
    #     Neither arrived, so every signature was computed with an empty key and
    #     MinIO rejected it: attachment upload/download URLs, the GDPR export
    #     upload, and the account-deletion object purge were all dead.
    # Run OUR server.ts, not the image's file-glob runtime (see header).
    #
    # The install step is part of the entrypoint on purpose. The image's own
    # start.sh used to do the installing; bypassing it means nothing else does,
    # and a fresh clone has no backend/functions/node_modules — so the container
    # crash-looped with ERR_MODULE_NOT_FOUND 'tsx' on a correctly followed
    # self-host walkthrough (found by the 2026-08-24 fork drill). It is a no-op
    # on every boot after the first, because node_modules lives on the bind
    # mount. tsx is --no-save: it is the loader, not a dependency of the code.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /opt/project
        # Unconditional, not guarded by a presence check. A boot that failed
        # part-way — for example against the read-only root filesystem the
        # generated compose sets — leaves a node_modules that has the top-level
        # packages and is missing transitive ones, and every cheap check
        # (node_modules/tsx exists, `npm ls --depth=0`) passes on that tree and
        # skips the repair. npm is a no-op in a couple of seconds when the tree
        # is already complete, and fixes it when it is not.
        echo "[functions] ensuring dependencies"
        npm install --omit=dev --prefer-offline --no-audit --no-fund --loglevel=error
        npm install --no-save --prefer-offline tsx@4 --no-audit --no-fund --loglevel=error
        exec node --import tsx/esm server.ts
    working_dir: /opt/project
    environment:
      # The generated nginx upstream uses FUNCTIONS_PORT as the CONTAINER port,
      # so the app must bind exactly that. Hardcoding 3001 works only while
      # FUNCTIONS_PORT is left at its default; a self-hoster who changes it gets
      # `host not found in upstream "functions:<their port>"` and an nginx that
      # will not start. One variable drives the bind, the healthcheck, the
      # published port and hasura's ACTION_HANDLER_URL.
      PORT: "${FUNCTIONS_PORT:-3001}"
      NHOST_WEBHOOK_SECRET: ${NHOST_WEBHOOK_SECRET:-}
      AUTH_PORT: ${AUTH_PORT:-4000}
      HASURA_AUTH_URL: ${HASURA_AUTH_URL:-http://auth:${AUTH_PORT:-4000}}
      HASURA_GRAPHQL_URL: ${HASURA_GRAPHQL_URL:-http://hasura:8080/v1/graphql}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ENDPOINT_PUBLIC: ${MINIO_ENDPOINT_PUBLIC:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ntask}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # `nself build` does not emit MINIO_ACCESS_KEY/MINIO_SECRET_KEY: the
      # credentials MinIO actually accepts are MINIO_ROOT_USER (hardcoded to
      # `minioadmin` by the generator) and MINIO_ROOT_PASSWORD (.env.secrets).
      # Prefer an explicit override, else fall back to the real root credentials.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
      # Sixth casualty of the same env-passthrough gap: this service sends its
      # own transactional mail (list invites) over SMTP, because hasura-auth has
      # no relay route for anyone else's messages. Without these the mailer
      # reports NTASK-EMAIL-UNCONFIGURED and the invite says so, rather than
      # claiming a delivery that never happened. AUTH_SMTP_* is the same
      # configuration hasura-auth uses, so one credential set serves both.
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-${SMTP_HOST:-}}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-${SMTP_PORT:-1025}}
      AUTH_SMTP_SECURE: ${AUTH_SMTP_SECURE:-${SMTP_SECURE:-false}}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:-${SMTP_USER:-}}
      AUTH_SMTP_PASS: ${AUTH_SMTP_PASS:-${SMTP_PASS:-}}
      AUTH_SMTP_SENDER: ${AUTH_SMTP_SENDER:-${SMTP_SENDER:-}}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-${AUTH_SMTP_SENDER:-${SMTP_SENDER:-}}}
      NTASK_APP_BASE_URL: ${NTASK_APP_BASE_URL:-https://task.nself.org}
    read_only: false
    volumes:
      # The generated service mounts backend/functions at /opt/project only, so
      # backend/email-templates is invisible to it and the invite mail failed
      # with "template unreadable" on a correctly configured stack. hasura-auth
      # gets the same directory mounted for the same reason.
      - ./email-templates:/opt/project/email-templates:ro
    tmpfs:
      - /tmp
      - /run
    # WORKAROUND: this Docker Desktop session has a stuck stale port-forward
    # registration on host port 127.0.0.1:3001 (reproduced repeatedly: no
    # process/container on the host or inside the Docker Desktop VM holds
    # the port, yet every attempt to publish 3001 for this service fails
    # with "port is already allocated", regardless of container name).
    # Publish on 3011 instead until Docker Desktop is restarted and the
    # stale proxy entry clears. Internal container-to-container traffic
    # (nginx -> functions:3000, hasura ACTION_HANDLER_URL -> functions:3000)
    # is unaffected — only the host-side published port changes.
    ports:
      - 127.0.0.1:3011:${FUNCTIONS_PORT:-3001}
    healthcheck:
      # 127.0.0.1, not localhost. In this image localhost resolves to ::1 first and
      # server.ts binds IPv4 0.0.0.0, so the probe answered "connection refused"
      # and marked a service unhealthy that was serving every request Hasura sent
      # it. Confirmed inside the container: wget to 127.0.0.1:3001/healthz returns
      # {"status":"ok"}, wget to localhost:3001/healthz is refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${FUNCTIONS_PORT:-3001}/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Third gap, same generator: hasura's action definitions (metadata/actions.yaml)
  # reference {{ACTION_HANDLER_URL}}, and .env.dev declares
  # ACTION_HANDLER_URL=http://host.docker.internal:3001, but `nself build` never
  # forwards it into the hasura service's `environment:` block — so any
  # metadata reload (replace_metadata) that revalidates action definitions
  # fails with "Value for environment variables not found: ACTION_HANDLER_URL".
  # CLI gap filed: nself-hasura-action-env-passthrough (nself build should
  # forward any *_HANDLER_URL / action-referenced env var declared in .env.dev
  # into the hasura service automatically).
  hasura:
    environment:
      # functions/server.ts binds FUNCTIONS_PORT (see that service above); 3011
      # is only the host-side published port, container-to-container traffic
      # uses the container port.
      ACTION_HANDLER_URL: http://functions:${FUNCTIONS_PORT:-3001}
      # Referenced by `value_from_env` in metadata/{actions,event_triggers,
      # cron_triggers}.yaml, so it must EXIST here or metadata apply fails with
      # "Value for environment variables not found". Same value as the functions
      # service above.
      NHOST_WEBHOOK_SECRET: ${NHOST_WEBHOOK_SECRET:-}

  # Fourth gap, same generator: nginx's healthcheck probes
  # `https://127.0.0.1/health` with no SNI/Host header, so TLS falls to
  # whichever `listen 443 ssl` vhost loads first (currently
  # docs.task.local.nself.org via api-docs.conf) — that vhost has no
  # `/health` location, so the probe 404s even though nginx itself and every
  # real vhost are fine. The `/health` location that actually exists
  # (conf.d/default.conf, `location /health { return 200 'OK' }`) is only
  # bound on the plain-HTTP `listen 80 default_server` block, not 443.
  # Fix: probe port 80 instead of 443 — same default_server block, same
  # `/health` location, no TLS/SNI ambiguity.
  # CLI gap filed: nself-nginx-healthcheck-sni-mismatch (compose generator's
  # nginx healthcheck should target the plain-HTTP default_server, or
  # nself.yaml needs a `services.nginx.healthcheck` override field).
  nginx:
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # Sixth gap, same generator class: `nself build` has no nself.yaml field for
  # mounting custom email templates into the auth container, so
  # nhost/hasura-auth:0.36.0 always fell back to its own bundled defaults —
  # which render "Powered by Nhost" (a competitor) branding on every
  # transactional email (password reset, email verify, email-change confirm).
  # We already had ɳTask-branded HTML in email-templates/, but it was never
  # mounted AND used the wrong placeholder syntax ({{ .Link }}, a Go
  # text/template convention) — hasura-auth's mailer actually renders with
  # valyala/fasttemplate using ${...} delimiters (confirmed by reading
  # go/notifications/templates.go in the hasura-auth source for this exact
  # image tag), so the old templates would have shipped a dead, unsubstituted
  # link even if they had been wired up. Fixed both: templates restructured to
  # the {locale}/{template-id}/{body.html,subject.txt} layout the mailer's
  # filesystem walker expects (see NewTemplatesFromFilesystem), rewritten to
  # use ${link}/${email}/${newEmail}, and mounted here.
  # CLI gap filed: nself-auth-email-templates-mount (nself.yaml needs an
  # `auth.email_templates_path` field so this survives without a hand-authored
  # override).
  auth:
    environment:
      AUTH_EMAIL_TEMPLATES_PATH: /app/email-templates
      # Eighth gap, different bug class: hasura-auth 0.36.0's SMTP PLAIN-auth
      # client (go/notifications/stdlib.go isLocalhost()) only trusts an
      # UNENCRYPTED connection to a hostname it hardcodes as one of
      # "mailhog"/"localhost"/"127.0.0.1"/"::1" — any other hostname over a
      # non-TLS connection is rejected with "unencrypted connection", even
      # with AUTH_SMTP_SECURE=false and no credentials configured. But
      # .env.dev/nself build set AUTH_SMTP_HOST to the literal string
      # "mailpit", which isn't on that allowlist, so EVERY outbound email
      # (password reset, verify, email-change, and any app-level SMTP relay
      # send) silently 500s in local dev regardless of template content.
      # Override to the one hostname the binary trusts; the mail-catcher
      # container below is named/aliased to match.
      # CLI gap filed: nself-hasura-auth-smtp-host-mailhog-only (nself build's
      # SMTP_HOST templating should emit "mailhog", not "mailpit", for
      # hasura-auth — or nself.yaml needs a dev-mail-catcher-hostname field).
      AUTH_SMTP_HOST: mailhog
    volumes:
      - ./email-templates:/app/email-templates:ro

  # Ninth gap, same generator class as above: nself.yaml already declares
  # `mailhog: dev_only: true` (intent to run a local mail catcher for dev),
  # but `nself build` never emits a mail-catcher container into
  # docker-compose.yml at all — so in dev there was nothing listening on the
  # SMTP host to begin with. Added here as the local dev mail catcher
  # nself.yaml already asked for, and needed to verify the email-template fix
  # above end-to-end. Must be the real `mailhog/mailhog` image, not a
  # mailpit/other catcher relabeled: hasura-auth 0.36.0 unconditionally issues
  # an SMTP `AUTH PLAIN` command on every send regardless of whether
  # credentials are configured (go/notifications/stdlib.go sendMail() calls
  # c.Auth(a) unconditionally), and mailpit's default SMTP listener returns
  # "502 5.5.1 Command not implemented" for AUTH — confirmed by testing both.
  # MailHog implements/accepts AUTH PLAIN with any credentials, matching what
  # hasura-auth's own isLocalhost() allowlist comment says it was built for.
  # CLI gap filed: nself-mailhog-service-not-generated (nself build should
  # emit the mail-catcher container declared by `mailhog:` in nself.yaml).
  #
  # Network and container names are derived from PROJECT_NAME, exactly as the
  # generator derives them. They used to be hardcoded to `ntask_*`, so any fork
  # that set a different PROJECT_NAME (which is what a self-hoster does) failed
  # the whole stack at compose parse time with
  #   service "mailhog" refers to undefined network ntask_network
  # — an error that names mailhog and says nothing about the real cause.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${PROJECT_NAME:-ntask}_mailhog
    restart: unless-stopped
    networks:
      - ${PROJECT_NAME:-ntask}_network
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025
