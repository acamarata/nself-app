# ntask production - api.task.nself.org (Hasura GraphQL + MinIO storage)
#
# Lives in conf.d/, NOT sites/, on purpose: `nself build` deletes every
# file in nginx/sites/ before regenerating it, which would silently take
# this host down. conf.d/ is hand-managed and is never cleared.
# Hand-maintained - not generated. Do not remove without stopping ntask.
upstream ntask_up_storage {
    server ntask_minio:9000;
    keepalive 16;
}

upstream ntask_up_api {
    server ntask_hasura:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.task.nself.org;

    ssl_certificate /etc/nginx/ssl/api-task-nself-org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api-task-nself-org/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: the app host sets this and the API host did not, which left the API
    # downgradeable even though the app it serves was not. Same max-age as the
    # app vhost (1 year, includeSubDomains). No preload — that is a domain-wide
    # commitment and belongs on the apex, not on one subdomain vhost.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # This host serves JSON and presigned redirects only; it should never be
    # able to load or execute anything. `default-src 'none'` is the correct
    # policy for an API and makes the host useless as a content vector if a
    # response type is ever mishandled.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=10s;

    location = /healthz {
        proxy_pass http://ntask_up_api/healthz;
        proxy_set_header Host $host;
    }

    # Presigned S3 URLs handed to browsers point here. The signature covers the
    # path and query, so the URI must be passed through untouched — hence the
    # trailing slash on proxy_pass, which strips the /storage prefix and leaves
    # the rest verbatim. Uploads can be large, so buffering is off and the body
    # limit is raised.
    location /storage/ {
        # `general` (10r/s), not `uploads` (5r/m): this path serves downloads as
        # well as uploads, and 5r/m would fail a task with a handful of
        # attachments. Bounds abuse without breaking normal reads.
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;

        proxy_pass http://ntask_up_storage/;
        # MinIO sets its own Strict-Transport-Security, which arrived alongside
        # the one this vhost adds — two STS headers on every object response.
        # Harmless (the first wins) but ambiguous; keep this vhost the single
        # authority for transport policy.
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }

    location / {
        # Matches the pattern the other vhosts already use (hasura.conf):
        # graphql_api is 100r/m, burst 20 nodelay so a normal session that
        # bursts on load is not penalised, while sustained abuse is throttled.
        # This host had NO rate limiting at all — 30 rapid GraphQL requests all
        # returned 200 — despite the zones being defined and used elsewhere.
        limit_req zone=graphql_api burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;

        proxy_pass http://ntask_up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 86400;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
