# J-S3: Functions service — Hasura Action handlers
# Service: functions.localhost
# Routes /api/actions/* to the Node.js functions container

server {
    listen 80;
    listen [::]:80;
    server_name functions.localhost;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Block access to sensitive paths
    location ~ /\.(env|git|svn|htaccess|htpasswd|dockerignore) {
        return 404;
    }

    # J-S3-T1: Account deletion — strict per-user rate limit
    # 1 request per 5 minutes per JWT (account_delete zone)
    location = /api/actions/delete-account {
        limit_req zone=account_delete burst=1 nodelay;
        limit_req zone=functions burst=5 nodelay;
        limit_conn conn_limit_per_ip 2;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://functions:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 120;
    }

    # J-S3-T2: Data export — 1 request per hour per JWT (also enforced in-function)
    location = /api/actions/export-data {
        limit_req zone=account_export burst=1 nodelay;
        limit_req zone=functions burst=5 nodelay;
        limit_conn conn_limit_per_ip 2;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://functions:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 180;
    }

    # J-AUX-2: Invite endpoints — 20 per hour per JWT
    location ~ ^/api/actions/invite {
        limit_req zone=invite_limit burst=5 nodelay;
        limit_req zone=functions burst=10 nodelay;
        limit_conn conn_limit_per_ip 5;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://functions:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30;
    }

    # J-S2: Account management ops (change-email, change-password, MFA, sessions)
    location ~ ^/api/actions/(change-email|change-password|enable-mfa|disable-mfa|list-sessions|revoke-session) {
        limit_req zone=account_ops burst=5 nodelay;
        limit_req zone=functions burst=10 nodelay;
        limit_conn conn_limit_per_ip 5;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://functions:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 30;
    }

    # General functions passthrough (event triggers, etc.)
    location / {
        limit_req zone=functions burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://functions:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 60;
    }
}
