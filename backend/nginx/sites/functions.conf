# Generated by nself build - DO NOT EDIT MANUALLY
# Service: functions.staging.nself.org
# Named upstream with keepalive so proxied requests reuse backend TCP
# connections instead of opening a new handshake per request. nginx resolves
# the server address ONCE when this upstream block loads (build/reload time)
# and caches it for the life of the worker process — fine for services that
# never get recreated with a new container IP outside a full `nself build`.
upstream up_functions {
    server functions:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name functions.staging.nself.org;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Block access to sensitive files and directories
    location ~ /\.(env|git|svn|htaccess|htpasswd|dockerignore) {
        return 404;
    }
    location ~ ^/(docker-compose|Dockerfile) {
        return 404;
    }

    location = /healthz {
        proxy_pass http://functions:3001;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=functions burst=15 nodelay;
        limit_conn conn_limit_per_ip 10;
        proxy_pass http://up_functions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_request_headers on;
    }
}
