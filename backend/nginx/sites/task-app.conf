# nTask web app (SPA) — task.local.nself.org
# NOTE: hand-added to fill an nself gap — nself build does not yet generate a
# frontend/app vhost (only backend service vhosts). PCI: nself-frontend-app-route.
# Proxies to the Vite dev server on the host (HMR) for local "dev fast".

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/certificates/task-local-nself-org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certificates/task-local-nself-org/privkey.pem;
    server_name task.local.nself.org;

    server_tokens off;

    # Vite dev server (HMR) running natively on the host.
    location / {
        proxy_pass http://host.docker.internal:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HMR websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
