# Catch-all HTTPS default server: answers the container healthcheck.
#
# The Docker healthcheck calls `wget https://127.0.0.1/health`. A request to a
# bare IP sends no SNI, so without an explicit 443 default_server it falls
# through to the first/only named vhost (docs.localhost), which has no /health
# route and returns 404 -> container reported "unhealthy". This block claims the
# 443 default so the healthcheck resolves here; named vhosts still match by SNI.
#
# Durable fix tracked in PCI ntask-nginx-healthcheck-https-404 (nself CLI template).

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/certificates/localhost/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certificates/localhost/privkey.pem;

    server_tokens off;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Anything else hitting the bare IP / unmatched host gets a clean 444.
    location / {
        return 444;
    }
}
