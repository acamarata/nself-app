# J-AUX-2 + J-S3: Account lifecycle and action endpoint rate limiting
#
# These zones supplement K's rate-limits.conf (do NOT edit that file).
# Zone naming uses the "account_" prefix to avoid collisions with K's zones.
#
# account_delete:  1 req/5min per user JWT — hard cap on deletion attempts
# account_export:  1 req/hour per user JWT — GDPR export cooldown (also enforced in-function)
# account_ops:     20 req/min per IP — change-email, change-password, MFA ops
# invite_limit:    20 req/hour per user JWT — J-AUX-2 invite abuse prevention

# Keyed on Authorization header (user JWT) for per-user limits
limit_req_zone $http_authorization zone=account_delete:5m   rate=1r/5m;
limit_req_zone $http_authorization zone=account_export:5m   rate=1r/60m;
limit_req_zone $binary_remote_addr zone=account_ops:10m     rate=20r/m;
limit_req_zone $http_authorization zone=invite_limit:10m    rate=20r/60m;
