# nself.yaml — ntask bundle manifest
# Format: provisional (PCI filed: nself-yaml-bundle-format)
# This file documents plugin/service intent for the ntask reference app.
#
# TRUTHFUL-ALIGNMENT NOTE (2026-07-03): `nself build` does NOT read this file.
# Confirmed by source inspection (nself-org/cli internal/build/plugins.go,
# internal/config/types.go) — the CLI's entire Config struct is populated only
# from the .env cascade (`env:"..."` struct tags); no YAML parser exists for
# this manifest anywhere in the cli codebase. The `plugins:` block below is
# aspirational until the CLI implements a reader for it (see the "plugins"
# subsection for what's actually active vs. native vs. unwired).
# Tracked: PCI nself/plugin-injection-dropped, PCI nself-yaml-bundle-format.
#
# Plugin names must match directory names under plugins/free/.
# All plugins listed here are free tier — no license key required.

app: ntask
display_name: "ɳTask"
version: "1.1.4"
bundle: ntask          # free bundle, no license key required
tier: free

# =============================================================================
# AUTH MODE
# =============================================================================
# auth_mode controls whether nTask runs its own hasura-auth container or
# delegates JWT validation to an external shared nSelf auth deployment.
#
#   auth_mode: bundled  (default) — runs hasura-auth in this stack.
#     Use for: local dev, self-hosted "nTask Bundle", Docker-only deploys.
#     Exposes auth at auth.<domain> via this stack's nginx.
#     One `nself start` yields a fully working standalone stack.
#
#   auth_mode: external — no local auth container; JWT validated via external auth.
#     Use for: nself.org SaaS (auth.{env}.nself.org run by the platform stack).
#     Set SHARED_AUTH_JWT_SECRET to match the external auth's JWT secret.
#     Set HASURA_AUTH_URL and SHARED_AUTH_SERVER_URL to the external auth endpoint.
#
# In BOTH modes, HASURA_GRAPHQL_JWT_SECRET must be env-templated (never hardcode).
#   bundled:  JWT secret generated by `nself init` → stored in .env.secrets
#   external: JWT secret = shared platform auth secret → injected at deploy time
#
# nself.yaml CLI gap: auth_mode toggle not yet natively supported by nself build.
# The compose profile/override pattern in docker-compose.*.yml implements it.
# PCI filed: nself-auth-mode-toggle
# =============================================================================
auth_mode: bundled

plugins:
  free:
    # ACTIVE — run as their own containers in docker-compose.yml (auth_mode:
    # bundled), NOT via nself's plugin-injection mechanism.
    - auth             # Hasura Auth: email/password + OAuth user management (bundled mode)
    - storage          # Hasura Storage: S3-compatible file storage via MinIO
    # IMPLEMENTED NATIVELY — no plugin container involved; logic lives in this
    # repo's own functions/ + hasura/metadata/, not plugins/free/*.
    # - cron        → Hasura scheduled/cron triggers (hasura/metadata/)
    # - notify      → functions/notify-dispatch.ts
    # - invitations → functions/collab-ops.ts + migrations/021_add_list_invites.sql
    #
    # AVAILABLE IN plugins/free/ BUT NOT WIRED — no docker-compose.plugin.yml
    # installed under ~/.nself/plugins/ for this stack. Enable when nself's
    # plugin-manifest injection ships (see note at top of this file):
    #   notifications  — push notification delivery: FCM/APNs device push
    #   jobs           — background job queue: async processing and retries
    #   search         — full-text task search: Postgres tsvector index
    #   feature-flags  — feature rollout control: per-user and global flags
    #   audit-log      — audit trail: tamper-evident mutation log
    #   webhooks       — outbound webhook delivery: HTTP callbacks on events
    #   tokens         — API token management: scoped long-lived tokens

services:
  postgres:
    version: "16"
    db: ntask
  hasura:
    version: "v2.42.0"
  # auth service: active when auth_mode=bundled (default).
  # In auth_mode=external, exclude via compose profile or remove this block.
  # HASURA_GRAPHQL_JWT_SECRET must be set in .env.secrets in both modes.
  auth:
    version: "0.32.1"
  storage:
    version: "0.6.1"
  minio: {}
  # functions service — serves Hasura Action + event trigger webhooks.
  # nself build generates a compose block mounting ./functions:/opt/project.
  # ACTION_HANDLER_URL must be http://functions:3001 when running inside Docker.
  # CLI gap: nself-functions-service-entrypoint (see PCI note in PR).
  # The nhost/functions:latest image (Node.js runtime) mounts ./functions and
  # runs server.ts as the entrypoint via `node --loader tsx server.ts`.
  functions:
    enabled: true
    port: 3001
  mailhog:
    dev_only: true
  traefik:
    prod_only: true
