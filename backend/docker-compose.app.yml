# NSELF-FIRST EXCEPTION: d6-any-stack — see PRI § Hard Rule nSelf-First Doctrine
# ntask/backend/ uses Docker Compose directly (not nSelf CLI) as the "any-stack" reference example.
# This file is hand-authored, not generated by nself build.
# Updated Epic I (2026-06-27): env vars updated from NEXT_PUBLIC_* (legacy Next.js) to Vite web SaaS
# (VITE_*). Mobile Expo env vars use EXPO_PUBLIC_* prefix — see apps/mobile/.env.example.
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_PROVIDER: ${VITE_BACKEND_PROVIDER:-nself}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production}
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - VITE_BACKEND_PROVIDER=${VITE_BACKEND_PROVIDER:-nself}
      - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-production}
      - VITE_APP_NAME=${VITE_APP_NAME:-ɳTasks}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:3001}
      # ɳSelf GraphQL + Auth + Storage (Vite web SaaS)
      - VITE_HASURA_URL=${VITE_HASURA_URL}
      - VITE_HASURA_WS_URL=${VITE_HASURA_WS_URL}
      - VITE_AUTH_URL=${VITE_AUTH_URL}
      - VITE_STORAGE_URL=${VITE_STORAGE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
