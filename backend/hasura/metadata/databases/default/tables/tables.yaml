- table:
    schema: public
    name: np_activity
  object_relationships:
  - name: todo
    using:
      foreign_key_constraint_on: todo_id
  - name: actor
    using:
      foreign_key_constraint_on: actor_id
  insert_permissions:
  - role: user
    permission:
      columns:
      - todo_id
      - action
      - metadata
      # SECURITY: `todo_id` was unvalidated (and the actor_id check was vacuous,
      # since actor_id is force-`set` below), so any user could forge activity
      # entries on any todo in the system. The parent todo must now be one the
      # caller can actually see — mirrors this table's own select filter.
      check:
        _and:
        - actor_id:
            _eq: X-Hasura-User-Id
        - _or:
          - todo:
              user_id:
                _eq: X-Hasura-User-Id
          - todo:
              list:
                shares:
                  shared_with_user_id:
                    _eq: X-Hasura-User-Id
      set:
        actor_id: X-Hasura-User-Id
  select_permissions:
  - role: user
    permission:
      columns:
      - id
      - todo_id
      - actor_id
      - action
      - metadata
      - created_at
      filter:
        _or:
        - todo:
            user_id:
              _eq: X-Hasura-User-Id
        - todo:
            list:
              shares:
                shared_with_user_id:
                  _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: &id068
      - id
      - todo_id
      - actor_id
      - action
      - metadata
      - created_at
      filter: {}
      allow_aggregations: true
  - role: app_admin
    permission:
      columns: *id068
      filter: {}
      allow_aggregations: true
  - role: mod
    permission:
      columns: *id068
      filter: {}
      allow_aggregations: true
  - role: dev
    permission:
      columns: *id068
      filter: {}
      allow_aggregations: true
  - role: support
    permission:
      columns: *id068
      filter: {}
      allow_aggregations: true

# np_account_activity — server-side account lifecycle audit log (migration 020).
#
# The table existed and was written to by five handlers (user-delete, user-export,
# account-ops x4, collab-ops), but was never tracked here — so every
# `insert_np_account_activity_one` was rejected by Hasura as an unknown field. The
# per-file admin helpers only checked res.ok, so those rejections came back as
# HTTP 200 and the handlers reported success with nothing written. Tracking it is
# what makes the audit trail real.
#
# No role permissions: inserts come exclusively from the functions service using
# the admin secret, which bypasses permissions. Grant a select permission here if
# and when a client surface needs to read its own activity.
- table:
    schema: public
    name: np_account_activity

# np_member_profiles — non-sensitive collaborator identity (migration 029).
#
# WHY THIS EXISTS: the clients render list rosters and the presence strip from a
# `profile` field on np_list_members / np_list_presence. That relationship was
# never defined, so GET_LIST_MEMBERS, GET_LIST_PRESENCE and
# SUBSCRIBE_LIST_PRESENCE (apps/mobile/src/lib/collabOps.ts) failed validation and
# the rosters could not render.
#
# WHY NOT np_profiles / auth.users: both are scoped for role `user` to
# `id = X-Hasura-User-Id` (PR #95, so one user cannot read another's email).
# Hasura applies the TARGET table's permission when traversing a relationship, so
# a relationship to either would resolve to null for every other member, and the
# only way to make it resolve would be to widen the very filter that closed the
# email hole. This view has no email column, so co-member visibility here cannot
# leak an address no matter how the permission below evolves.
#
# ROW SCOPE: the caller, plus anyone who is a member of a list the caller owns or
# is a member of. A user who shares no list with the caller is not visible at all.
- table:
    schema: public
    name: np_member_profiles
  array_relationships:
  # Used only by the permission predicate below (Hasura evaluates permission
  # relationships regardless of the related table's own permissions).
  - name: list_memberships
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: np_list_members
        column_mapping:
          id: user_id
  select_permissions:
  - role: user
    permission:
      # NOTE: `email` is intentionally absent — it is not a column of this view.
      columns:
      - id
      - display_name
      - avatar_url
      - source_account_id
      - updated_at
      filter:
        _or:
        - id:
            _eq: X-Hasura-User-Id
        - list_memberships:
            list:
              _or:
              - user_id:
                  _eq: X-Hasura-User-Id
              - members:
                  user_id:
                    _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: &id069
      - id
      - display_name
      - avatar_url
      - source_account_id
      - updated_at
      filter: {}
  - role: app_admin
    permission:
      columns: *id069
      filter: {}
  - role: mod
    permission:
      columns: *id069
      filter: {}

# auth.refresh_tokens is DELIBERATELY NOT TRACKED HERE.
#
# hasura-auth owns the metadata for its own schema: on startup it (re)applies a
# table configuration giving auth.refresh_tokens the root fields
# `authRefreshTokens` / `authRefreshToken` / `deleteAuthRefreshTokens` and
# camelCase column names (userId, createdAt, expiresAt), and it already grants
# role `user` select on that table filtered to `user_id = X-Hasura-User-Id`.
#
# Declaring the table here with no `configuration` block would make a metadata
# apply STRIP those custom names until the auth container next restarts, breaking
# hasura-auth's own queries. functions/account-ops.ts therefore uses the
# hasura-auth root-field names directly and this file leaves the table alone.
#
# (Same caveat applies to the auth.users entry above, which exists only to carry
# the own-row select permission from PR #95 — verified still live 2026-08-16.)
