- table:
    schema: public
    name: np_attachments
  object_relationships:
  - name: todo
    using:
      foreign_key_constraint_on: todo_id
  - name: comment
    using:
      foreign_key_constraint_on: comment_id
  - name: uploader
    using:
      foreign_key_constraint_on: uploader_id
  insert_permissions:
  - role: user
    permission:
      columns:
      - todo_id
      - comment_id
      - storage_key
      # SECURITY: `bucket` removed from client-insertable columns. The server
      # never lets a client choose a bucket (storage-presign.ts always signs
      # MINIO_BUCKET), but getDownloadUrl honours `attachment.bucket`, so a
      # client-chosen value allowed cross-bucket traversal. The column default
      # ('ntask') now applies.
      - file_name
      - mime_type
      - file_size_bytes
      - acl
      - source_account_id
      # SECURITY: previously only `uploader_id` was validated, and uploader_id is
      # force-`set` below — so the check was vacuous and the client was free to
      # choose any storage_key. getDownloadUrl authorises on `uploader_id ==
      # caller`, then signs storage_key with the MinIO root credentials: a user
      # could register a row on their own todo pointing at another user's object
      # (e.g. exports/{victim}/data-export-*.json) and download it.
      #
      # storage_key_owner is a generated column (migration 028) holding the UUID
      # segment of attachments/{uuid}/... — Hasura cannot concatenate a session
      # variable with a literal prefix, so the prefix rule is expressed as an
      # equality on that derived column. Non-canonical keys yield NULL and fail.
      #
      # todo ownership is also enforced here, matching getUploadUrl (which
      # requires todo.user_id == caller) and this table's own select filter.
      # NOTE the explicit `_is_null: false`. A non-canonical storage_key (e.g.
      # "exports/{victim}/data-export.json") yields storage_key_owner = NULL, and
      # `NULL = <uuid>` evaluates to NULL, which Postgres treats as a PASSING
      # check — so `_eq` alone still admitted the exact attack this fix targets.
      # Verified: without this clause the forged exports/ key was accepted.
      check:
        _and:
        - uploader_id:
            _eq: X-Hasura-User-Id
        - storage_key_owner:
            _is_null: false
        - storage_key_owner:
            _eq: X-Hasura-User-Id
        - todo:
            user_id:
              _eq: X-Hasura-User-Id
      set:
        uploader_id: X-Hasura-User-Id
  - role: owner
    permission:
      columns: &id035
      - todo_id
      - comment_id
      - storage_key
      - bucket
      - file_name
      - mime_type
      - file_size_bytes
      - acl
      - source_account_id
      - uploader_id
      check: {}
      set:
        uploader_id: X-Hasura-User-Id
  - role: app_admin
    permission:
      columns: *id035
      check: {}
      set:
        uploader_id: X-Hasura-User-Id
  select_permissions:
  - role: user
    permission:
      columns:
      - id
      - todo_id
      - comment_id
      - uploader_id
      - storage_key
      - bucket
      - file_name
      - mime_type
      - file_size_bytes
      - acl
      - source_account_id
      - created_at
      filter:
        todo:
          user_id:
            _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: &id036
      - id
      - todo_id
      - comment_id
      - uploader_id
      - storage_key
      - bucket
      - file_name
      - mime_type
      - file_size_bytes
      - acl
      - source_account_id
      - created_at
      filter: {}
      allow_aggregations: true
  - role: app_admin
    permission:
      columns: *id036
      filter: {}
      allow_aggregations: true
  - role: mod
    permission:
      columns: *id036
      filter: {}
      allow_aggregations: true
  - role: dev
    permission:
      columns: *id036
      filter: {}
      allow_aggregations: true
  - role: support
    permission:
      columns: *id036
      filter: {}
      allow_aggregations: true
