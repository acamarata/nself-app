# ---------------------------------------------------------------------------
# np_lists table
# ---------------------------------------------------------------------------
- table:
    schema: public
    name: np_lists
  object_relationships:
    - name: owner
      using:
        foreign_key_constraint_on: user_id
  array_relationships:
    - name: todos
      using:
        foreign_key_constraint_on:
          column: list_id
          table:
            schema: public
            name: np_todos
    - name: shares
      using:
        foreign_key_constraint_on:
          column: list_id
          table:
            schema: public
            name: np_list_shares
    - name: members
      using:
        foreign_key_constraint_on:
          column: list_id
          table:
            schema: public
            name: np_list_members
    - name: presence
      using:
        foreign_key_constraint_on:
          column: list_id
          table:
            schema: public
            name: np_list_presence
    - name: invites
      using:
        foreign_key_constraint_on:
          column: list_id
          table:
            schema: public
            name: np_list_invites
  insert_permissions:
    - role: user
      permission:
        columns:
          - title
          - description
          - color
          - icon
          - position
        check:
          user_id:
            _eq: X-Hasura-User-Id
        set:
          user_id: X-Hasura-User-Id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - user_id
          - title
          - description
          - color
          - icon
          - is_default
          - position
          - source_account_id
          - created_at
          - updated_at
        filter:
          _or:
            - user_id:
                _eq: X-Hasura-User-Id
            - shares:
                shared_with_user_id:
                  _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - title
          - description
          - color
          - icon
          - position
        filter:
          user_id:
            _eq: X-Hasura-User-Id
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          user_id:
            _eq: X-Hasura-User-Id

