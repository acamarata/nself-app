# Hasura Table Tracking Configuration
#
# This file tells Hasura which PostgreSQL tables to track and expose
# via the GraphQL API. It also defines permissions per role.
#
# After modifying, apply with:
#   hasura metadata apply
#
# Or use the Hasura Console UI to manage permissions visually.
#
# Roles:
#   - user: Authenticated users (JWT role from hasura-auth)
#   - public: Unauthenticated access (HASURA_GRAPHQL_UNAUTHORIZED_ROLE)
#   - me: Self-referential (user can only access their own data)

# ---------------------------------------------------------------------------
# np_profiles table
# ---------------------------------------------------------------------------
- table:
    schema: public
    name: np_profiles
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - email
          - display_name
          - bio
          - avatar_url
          - time_format
          - auto_hide_completed
          - default_list_id
          - notification_settings
          - theme_preference
          - source_account_id
          - created_at
          - updated_at
        filter:
          id:
            _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - display_name
          - bio
          - avatar_url
          - time_format
          - auto_hide_completed
          - default_list_id
          - notification_settings
          - theme_preference
        filter:
          id:
            _eq: X-Hasura-User-Id
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          id:
            _eq: X-Hasura-User-Id

# ---------------------------------------------------------------------------
# np_todos table
# ---------------------------------------------------------------------------
- table:
    schema: public
    name: np_todos
  object_relationships:
    - name: list
      using:
        foreign_key_constraint_on: list_id
  array_relationships:
    - name: recurring_instances
      using:
        foreign_key_constraint_on:
          column: parent_todo_id
          table:
            schema: public
            name: np_recurring_instances
    - name: todo_shares
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_todo_shares
    - name: subtasks
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_subtasks
    - name: comments
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_comments
    - name: file_attachments
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_attachments
    - name: assignees
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_todo_assignees
    - name: reminders
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_reminders
    - name: todo_tags
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_todo_tags
    - name: recurring_rule
      using:
        foreign_key_constraint_on:
          column: todo_id
          table:
            schema: public
            name: np_recurring_rules
  insert_permissions:
    - role: user
      permission:
        columns:
          - title
          - description
          - completed
          - is_public
          - list_id
          - priority
          - due_date
          - tags
          - notes
          - source_account_id
        check:
          user_id:
            _eq: X-Hasura-User-Id
        set:
          user_id: x-hasura-User-Id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - user_id
          - title
          - description
          - completed
          - is_public
          - list_id
          - priority
          - due_date
          - tags
          - notes
          - source_account_id
          - created_at
          - updated_at
        filter:
          user_id:
            _eq: X-Hasura-User-Id
    # PUBLIC ROLE: intentional — read-only access to tasks with is_public=true (shareable link feature). Do NOT add insert/update/delete for public role.
    - role: public
      permission:
        columns:
          - id
          - user_id
          - title
          - description
          - completed
          - is_public
          - created_at
          - updated_at
        filter:
          is_public:
            _eq: true
  update_permissions:
    - role: user
      permission:
        columns:
          - title
          - description
          - completed
          - is_public
        filter:
          user_id:
            _eq: X-Hasura-User-Id
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          user_id:
            _eq: X-Hasura-User-Id

