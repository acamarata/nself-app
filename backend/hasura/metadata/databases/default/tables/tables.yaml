- table:
    schema: public
    name: np_todos
  object_relationships:
  - name: list
    using:
      foreign_key_constraint_on: list_id
  array_relationships:
  - name: recurring_instances
    using:
      foreign_key_constraint_on:
        column: parent_todo_id
        table:
          schema: public
          name: np_recurring_instances
  - name: todo_shares
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_todo_shares
  - name: subtasks
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_subtasks
  - name: comments
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_comments
  - name: file_attachments
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_attachments
  - name: assignees
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_todo_assignees
  - name: reminders
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_reminders
  - name: todo_tags
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_todo_tags
  - name: recurring_rule
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_recurring_rules
  - name: activity
    using:
      foreign_key_constraint_on:
        column: todo_id
        table:
          schema: public
          name: np_activity
  insert_permissions:
  - role: user
    permission:
      columns:
      - title
      - description
      - completed
      - is_public
      - list_id
      - priority
      - due_date
      - tags
      - notes
      - source_account_id
      - position
      # SECURITY: `list_id` was unvalidated, so a user could insert todos into
      # another user's list. list_id is nullable (todos need not belong to a
      # list), so a null list_id is explicitly allowed — a relationship check
      # alone would evaluate false and break list-less todos.
      check:
        _and:
        - user_id:
            _eq: X-Hasura-User-Id
        - _or:
          - list_id:
              _is_null: true
          - list:
              _or:
              - user_id:
                  _eq: X-Hasura-User-Id
              - shares:
                  shared_with_user_id:
                    _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
  - role: owner
    permission:
      columns: &id003
      - title
      - description
      - completed
      - is_public
      - list_id
      - priority
      - due_date
      - tags
      - notes
      - source_account_id
      - user_id
      - position
      check: {}
      set:
        user_id: x-hasura-User-Id
  - role: app_admin
    permission:
      columns: *id003
      check: {}
      set:
        user_id: x-hasura-User-Id
  select_permissions:
  - role: user
    permission:
      columns:
      - id
      - user_id
      - title
      - description
      - completed
      - is_public
      - source_account_id
      - created_at
      - updated_at
      - list_id
      - position
      - due_date
      - priority
      - tags
      - notes
      - reminder_time
      - location_name
      - location_lat
      - location_lng
      - location_radius
      - recurrence_rule
      - recurrence_parent_id
      - attachments
      - requires_approval
      - requires_photo
      - completed_by
      - approved
      - approved_by
      - approved_at
      - completion_photo_url
      - completion_notes
      - rejected_by
      - rejected_at
      - rejection_reason
      - completed_at
      - idempotency_key
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: public
    permission:
      columns:
      - id
      - title
      - completed
      - list_id
      - position
      - due_date
      - priority
      filter:
        is_public:
          _eq: true
  - role: owner
    permission:
      columns: &id004
      - id
      - user_id
      - title
      - description
      - completed
      - is_public
      - source_account_id
      - created_at
      - updated_at
      - list_id
      - position
      - due_date
      - priority
      - tags
      - notes
      - reminder_time
      - location_name
      - location_lat
      - location_lng
      - location_radius
      - recurrence_rule
      - recurrence_parent_id
      - attachments
      - requires_approval
      - requires_photo
      - completed_by
      - approved
      - approved_by
      - approved_at
      - completion_photo_url
      - completion_notes
      - rejected_by
      - rejected_at
      - rejection_reason
      - completed_at
      - idempotency_key
      filter: {}
      allow_aggregations: true
  - role: app_admin
    permission:
      columns: *id004
      filter: {}
      allow_aggregations: true
  - role: mod
    permission:
      columns: *id004
      filter: {}
      allow_aggregations: true
  - role: dev
    permission:
      columns: *id004
      filter: {}
      allow_aggregations: true
  - role: support
    permission:
      columns: *id004
      filter: {}
      allow_aggregations: true
  update_permissions:
  - role: user
    permission:
      columns:
      - title
      - description
      - completed
      - is_public
      - position
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
  - role: owner
    permission:
      columns: &id005
      - title
      - description
      - completed
      - is_public
      - position
      filter: {}
      check:
  - role: app_admin
    permission:
      columns: *id005
      filter: {}
      check:
  - role: mod
    permission:
      columns: *id005
      filter: {}
      check:
  delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: owner
    permission:
      filter: {}
  - role: app_admin
