# ---------------------------------------------------------------------------
# np_comments table
# ---------------------------------------------------------------------------
- table:
    schema: public
    name: np_comments
  object_relationships:
    - name: todo
      using:
        foreign_key_constraint_on: todo_id
    - name: author
      using:
        foreign_key_constraint_on: author_id
    - name: parent_comment
      using:
        foreign_key_constraint_on: parent_comment_id
  array_relationships:
    - name: replies
      using:
        foreign_key_constraint_on:
          column: parent_comment_id
          table:
            schema: public
            name: np_comments
    - name: attachments
      using:
        foreign_key_constraint_on:
          column: comment_id
          table:
            schema: public
            name: np_attachments
  insert_permissions:
    - role: user
      permission:
        columns:
          - todo_id
          - parent_comment_id
          - body
          - idempotency_key
          - source_account_id
        check:
          _and:
            - author_id:
                _eq: X-Hasura-User-Id
            - todo:
                user_id:
                  _eq: X-Hasura-User-Id
        set:
          author_id: X-Hasura-User-Id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - todo_id
          - author_id
          - parent_comment_id
          - body
          - idempotency_key
          - edited_at
          - deleted_at
          - source_account_id
          - created_at
          - updated_at
        filter:
          todo:
            user_id:
              _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - body
          - edited_at
        filter:
          author_id:
            _eq: X-Hasura-User-Id
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          author_id:
            _eq: X-Hasura-User-Id

