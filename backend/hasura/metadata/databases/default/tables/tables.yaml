- table:
    schema: auth
    name: users
  select_permissions:
  - role: user
    permission:
      columns:
      - id
      - display_name
      - avatar_url
      - email
      - created_at
      - updated_at
      - last_seen
      - default_role
      - is_anonymous
      - locale
      - email_verified
      # SECURITY: was `filter: {}` — any authenticated user could dump every
      # user's email + UUID from auth.users. Scoped to the caller's own row so
      # `email` is only ever visible to the owner of that row.
      # Collaborator identity does NOT flow through auth.users: no client query
      # selects the `users` root field, and no query traverses the
      # user/author/actor/assignee/uploader/owner/inviter relationships that
      # resolve here. Collab UIs read a `profile` field (-> np_profiles), so
      # narrowing this breaks no working read path.
      filter:
        id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
