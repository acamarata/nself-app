# ---------------------------------------------------------------------------
# np_list_presence table (real-time presence tracking)
# ---------------------------------------------------------------------------
- table:
    schema: public
    name: np_list_presence
  object_relationships:
    - name: list
      using:
        foreign_key_constraint_on: list_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  insert_permissions:
    - role: user
      permission:
        columns:
          - list_id
          - status
          - editing_todo_id
        check: {}
        set:
          user_id: X-Hasura-User-Id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - list_id
          - user_id
          - status
          - editing_todo_id
          - last_seen_at
          - created_at
        filter:
          list:
            _or:
              - user_id:
                  _eq: X-Hasura-User-Id
              - shares:
                  shared_with_user_id:
                    _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - status
          - editing_todo_id
          - last_seen_at
        filter:
          user_id:
            _eq: X-Hasura-User-Id
        check: null
  delete_permissions:
    - role: user
      permission:
        filter:
          user_id:
            _eq: X-Hasura-User-Id

