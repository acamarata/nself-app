# Hasura Event Triggers — ntask backend
#
# Applied by: scripts/metadata-reconcile.sh (targeted per-object replace), NOT by
# `hasura metadata apply` — a full apply untracks hasura-auth's 8 live-only tables.
# Drift is detected by `make metadata-diff HOST=<box>` (see scripts/metadata-diff.sh).
#
# Handler URL: {{ACTION_HANDLER_URL}}/events/<route>, matching backend/functions/server.ts.
#
# Event triggers are for EXTERNAL side effects. In-database bookkeeping belongs in a
# Postgres trigger: np_activity is written by migration 030's statement-level trigger,
# so nothing here logs activity (doing both would double every row).

- name: todo_assigned_trigger
  table:
    schema: public
    name: np_todo_assignees
  webhook: "{{ACTION_HANDLER_URL}}/events/todo-assigned"
  insert:
    columns: "*"
  retry_conf:
    num_retries: 3
    interval_sec: 10
    timeout_sec: 60
  headers:
    # Shared secret proving the caller is Hasura — functions/server.ts rejects a
    # mismatch with 401. Set NHOST_WEBHOOK_SECRET on hasura and functions.
    - name: x-nself-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  cleanup_config:
    batch_size: 10000
    clean_invocation_logs: true
    clear_older_than: 168
    paused: false
    schedule: "0 4 * * *"
    timeout: 60
  comment: "Notify the assignee when a todo is assigned to them (np_todo_assignees INSERT)"

- name: notify_dispatch_trigger
  table:
    schema: public
    name: np_notifications
  webhook: "{{ACTION_HANDLER_URL}}/events/notify-dispatch"
  insert:
    columns:
      - id
      - user_id
      - type
      - title
      - body
      - data
  retry_conf:
    num_retries: 3
    interval_sec: 30
    timeout_sec: 60
  headers:
    # Shared secret proving the caller is Hasura — functions/server.ts rejects a
    # mismatch with 401. Set NHOST_WEBHOOK_SECRET on hasura and functions.
    - name: x-nself-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  cleanup_config:
    batch_size: 10000
    clean_invocation_logs: true
    clear_older_than: 168
    paused: false
    schedule: "0 5 * * *"
    timeout: 60
  comment: "Dispatch push notifications when a new notification record is inserted"
