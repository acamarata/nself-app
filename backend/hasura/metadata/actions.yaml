# Hasura Actions Configuration
#
# J-S3-T1: deleteMyAccount
# J-S3-T2: requestDataExport
# J-S2-T1: changeEmail
# J-S2-T2: changePassword
# J-S2 aux: listSessions, revokeSession, enableMfa, disableMfa
#
# ACTION_HANDLER_URL resolves to the functions service (see docker-compose.yml).
# Local dev: http://functions:3001
# Staging/prod: set via HASURA_ACTION_HANDLER_URL env var in nself.yaml
#
# request_transform is intentionally OMITTED: the default Hasura action payload
# {action: {name}, input, session_variables} is already the shape that server.ts
# handlers expect. Adding a request_transform with object-body notation causes a
# v2 schema validation error; Kriti string templates work but add no value here.

actions:
  - name: deleteMyAccount
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/delete-account'
      timeout: 60
    permissions:
      - role: user
    comment: >
      J-S3-T1: Hard-delete all np_* rows + MinIO objects + auth.users for the
      authenticated user. Irreversible. HASURA_AUTH_ADMIN_SECRET is server-side only.

  - name: requestDataExport
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/export-data'
      timeout: 120
    permissions:
      - role: user
    comment: >
      J-S3-T2: GDPR Art. 20 data portability. Returns presigned MinIO URL
      valid 7 days. Rate-limited 1 request/24h per user.

  - name: changeEmail
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/change-email'
      timeout: 30
    permissions:
      - role: user
    comment: >
      J-S2-T1: Proxies to hasura-auth PATCH /user with new email.
      Triggers re-verification email. Old email valid until confirmed.

  - name: changePassword
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/change-password'
      timeout: 30
    permissions:
      - role: user
    comment: >
      J-S2-T2: Proxies to hasura-auth PATCH /user with new password.
      Min 8 chars enforced. Session stays valid on success.

  - name: revokeSession
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/revoke-session'
      timeout: 15
    permissions:
      - role: user
    comment: Proxies to hasura-auth DELETE /user/sessions/{id}. Idempotent.

  - name: enableMfa
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/enable-mfa'
      timeout: 30
    permissions:
      - role: user
    comment: Proxies to hasura-auth POST /user/mfa/totp/generate. Returns TOTP secret + QR URL.

  - name: disableMfa
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/disable-mfa'
      timeout: 30
    permissions:
      - role: user
    comment: Proxies to hasura-auth POST /user/mfa/totp/disable. Requires OTP confirmation.

  - name: listSessions
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/list-sessions'
      timeout: 15
      type: query
    permissions:
      - role: user
    comment: Proxies to hasura-auth GET /user/sessions. Returns active session list.

  # ── L-S1: Invite lifecycle ──────────────────────────────────────────────────

  - name: createListInvite
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/invite-create'
      timeout: 30
    permissions:
      - role: user
    comment: >
      L-S1-T1: Create a pending invite for an email address to join a list.
      Rate-limited 20/hour per JWT (invite_limit zone). Sends invite email via
      hasura-auth SMTP relay. Requires caller to be list owner or admin.

  - name: acceptListInvite
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/invite-accept'
      timeout: 30
    permissions:
      - role: user
    comment: >
      L-S1-T2: Accept a pending invite by token. Creates np_list_members row,
      links np_list_shares.shared_with_user_id, marks invite accepted.
      Only the invitee (email match) may accept.

  - name: declineListInvite
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/invite-decline'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S1-T3: Decline a pending invite by token. Sets status=declined.
      Only the invitee (email match) may decline.

  - name: revokeListInvite
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/invite-revoke'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S1-T4: Revoke a pending invite. Sets status=revoked.
      Only list owner or admin may revoke.

  # ── L-S2: Share links ───────────────────────────────────────────────────────

  - name: createShareLink
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/share-create'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S2-T1: Generate a public share-link token for a list. Upserts
      np_list_shares row with a random token and optional expires_at.
      Returns the full shareable URL. Owner/admin only.

  - name: revokeShareLink
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/share-revoke'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S2-T2: Revoke the share-link token for a list (sets token=NULL).
      Existing sessions with the old token lose access. Owner/admin only.

  # ── L-S3: Member management ─────────────────────────────────────────────────

  - name: updateMemberRole
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/member-role-update'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S3-T1: Change a member's role (owner/admin/member).
      Only list owner may change roles. Cannot demote the sole owner.

  - name: removeMember
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/member-remove'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S3-T2: Remove a member from a list. Owner/admin may remove editors/viewers.
      Cannot remove the sole owner.

  - name: leaveList
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/list-leave'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S3-T3: Authenticated user leaves a shared list they did not create.
      Blocked if the caller is the sole owner - must transferOwnership first.

  - name: transferOwnership
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/list-transfer-ownership'
      timeout: 15
    permissions:
      - role: user
    comment: >
      L-S3-T4: Atomic ownership transfer - demotes current owner to admin,
      promotes target member to owner. Only the current owner may invoke.
      Target must already be a list member.

  # ── L-S4: Presence ──────────────────────────────────────────────────────────

  - name: upsertPresence
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/presence-upsert'
      timeout: 10
    permissions:
      - role: user
    comment: >
      L-S4-T1: Upsert a presence record (viewing/editing + editing_todo_id).
      Called on heartbeat. Caller must be a list member or share recipient.

  - name: removePresence
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/presence-remove'
      timeout: 10
    permissions:
      - role: user
    comment: >
      L-S4-T2: Remove the caller's presence record from a list (on disconnect/blur).

  # ── Storage presign ─────────────────────────────────────────────────────────

  - name: getUploadUrl
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/get-upload-url'
      timeout: 15
    permissions:
      - role: user
    comment: >
      P5-W5: Returns a presigned MinIO PUT URL (SigV4, 15-min TTL) for direct
      client-to-MinIO upload. todoId must belong to the calling user.
      After upload, client persists the attachment via insertAttachment mutation
      using the returned storagePath.

  - name: getDownloadUrl
    definition:
      kind: synchronous
      handler: '{{ACTION_HANDLER_URL}}/api/actions/get-download-url'
      timeout: 15
    permissions:
      - role: user
    comment: >
      P5-W5: Returns a presigned MinIO GET URL (SigV4, 1-hour TTL) for
      an existing attachment. Access check: uploader OR todo owner OR list member.


custom_types:
  enums: []
  input_objects: []
  objects:
    - name: DeleteAccountResult
      fields:
        - name: success
          type: Boolean!
        - name: deletedAt
          type: String!

    - name: DataExportResult
      fields:
        - name: downloadUrl
          type: String!
        - name: expiresAt
          type: String!

    - name: ChangeEmailResult
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String!

    - name: ChangePasswordResult
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String!

    - name: Session
      fields:
        - name: id
          type: String!
        - name: createdAt
          type: String
        - name: updatedAt
          type: String
        - name: accessToken
          type: String
        - name: refreshToken
          type: String

    - name: SessionsResult
      fields:
        - name: sessions
          type: '[Session!]!'

    - name: RevokeSessionResult
      fields:
        - name: success
          type: Boolean!

    - name: MfaResult
      fields:
        - name: success
          type: Boolean!
        - name: totpSecret
          type: String
        - name: qrCodeUrl
          type: String
        - name: message
          type: String

    - name: InviteResult
      fields:
        - name: success
          type: Boolean!
        - name: inviteId
          type: String
        - name: message
          type: String

    - name: ShareLinkResult
      fields:
        - name: success
          type: Boolean!
        - name: shareUrl
          type: String
        - name: token
          type: String
        - name: expiresAt
          type: String

    - name: MemberResult
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String

    - name: PresenceResult
      fields:
        - name: success
          type: Boolean!

    - name: UploadUrlResult
      fields:
        - name: uploadUrl
          type: String!
        - name: storagePath
          type: String!
        - name: expiresAt
          type: String!

    - name: DownloadUrlResult
      fields:
        - name: downloadUrl
          type: String!
        - name: expiresAt
          type: String!


  scalars: []
