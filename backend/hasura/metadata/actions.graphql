# Hasura Actions - Custom GraphQL Operations
#
# J-S3-T1: deleteMyAccount — hard-delete all user data + auth record
# J-S3-T2: requestDataExport — GDPR Art. 20 data portability
# J-S2-T1: changeEmail — authenticated email update via hasura-auth
# J-S2-T2: changePassword — authenticated password update via hasura-auth
# J-S2 aux: listSessions, revokeSession, enableMfa, disableMfa


# ── L: Collaboration output types ─────────────────────────────────────────────

type InviteResult {
  success: Boolean!
  inviteId: String
  message: String
}

type ShareLinkResult {
  success: Boolean!
  shareUrl: String
  token: String
  expiresAt: String
}

type MemberResult {
  success: Boolean!
  message: String
}

type PresenceResult {
  success: Boolean!
}

# ── Storage presign output types ─────────────────────────────────────────────

type UploadUrlResult {
  """Presigned PUT URL — client uploads binary directly to MinIO (SigV4, 15-min TTL)."""
  uploadUrl: String!
  """Storage path to persist in np_attachments.storage_key after upload."""
  storagePath: String!
  expiresAt: String!
}

type DownloadUrlResult {
  """Presigned GET URL — client downloads attachment directly from MinIO (SigV4, 1-hour TTL)."""
  downloadUrl: String!
  expiresAt: String!
}

# ── Output types ──────────────────────────────────────────────────────────────

type DeleteAccountResult {
  success: Boolean!
  deletedAt: String!
}

type DataExportResult {
  downloadUrl: String!
  expiresAt: String!
}

type ChangeEmailResult {
  success: Boolean!
  message: String!
}

type ChangePasswordResult {
  success: Boolean!
  message: String!
}

type Session {
  id: String!
  createdAt: String
  updatedAt: String
  accessToken: String
  refreshToken: String
}

type SessionsResult {
  sessions: [Session!]!
}

type RevokeSessionResult {
  success: Boolean!
}

type MfaResult {
  success: Boolean!
  totpSecret: String
  qrCodeUrl: String
  message: String
}

# ── Mutations ─────────────────────────────────────────────────────────────────

type Mutation {
  """
  J-S3-T1: Hard-delete the authenticated user's account and all associated data.
  Cascades through all np_* tables, deletes MinIO objects, and removes the
  auth.users record. Irreversible. Requires role=user JWT.
  """
  deleteMyAccount: DeleteAccountResult

  """
  J-S3-T2: Request a GDPR Art. 20 data export. Returns a presigned MinIO URL
  valid for 7 days containing all the user's np_* data as JSON.
  Rate-limited to 1 request per 24 hours per user.
  """
  requestDataExport: DataExportResult

  """
  J-S2-T1: Change the authenticated user's email address.
  Triggers a verification email to the new address via hasura-auth.
  Old email remains valid until the new one is confirmed.
  """
  changeEmail(newEmail: String!): ChangeEmailResult

  """
  J-S2-T2: Change the authenticated user's password.
  Requires the CURRENT password: the handler re-authenticates against hasura-auth
  before applying the change, so a stolen access token alone cannot take over the
  account. Every refresh token is revoked on success, ending other sessions.
  Minimum 8 characters enforced server-side.
  """
  changePassword(currentPassword: String!, newPassword: String!): ChangePasswordResult

  """
  Revoke a specific session by ID (MFA/session management).
  """
  revokeSession(sessionId: String!): RevokeSessionResult

  """
  Enable TOTP-based MFA for the authenticated user.
  Returns TOTP secret and QR code URL for authenticator app setup.
  """
  enableMfa: MfaResult

  """
  Disable TOTP-based MFA. Requires OTP confirmation to prevent accidental lockout.
  """
  disableMfa(otp: String!): MfaResult

  # ── L-S1: Invite lifecycle ─────────────────────────────────────────────────

  createListInvite(listId: String!, email: String!, role: String!): InviteResult
  acceptListInvite(token: String!): InviteResult
  declineListInvite(token: String!): InviteResult
  revokeListInvite(inviteId: String!): InviteResult

  # ── L-S2: Share links ──────────────────────────────────────────────────────

  createShareLink(listId: String!, permission: String!, expiresInDays: Int): ShareLinkResult
  revokeShareLink(listId: String!): MemberResult

  # ── L-S3: Member management ────────────────────────────────────────────────

  updateMemberRole(listId: String!, userId: String!, role: String!): MemberResult
  removeMember(listId: String!, userId: String!): MemberResult
  leaveList(listId: String!): MemberResult
  transferOwnership(listId: String!, newOwnerId: String!): MemberResult

  # ── L-S4: Presence ─────────────────────────────────────────────────────────

  upsertPresence(listId: String!, status: String!, editingTodoId: String): PresenceResult
  removePresence(listId: String!): PresenceResult

  # ── Storage presign ─────────────────────────────────────────────────────────

  """
  P5-W5: Get a presigned PUT URL for direct client-to-MinIO upload.
  todoId must belong to the calling user. After successful PUT, persist the
  attachment row via insertAttachment mutation using the returned storagePath.
  Upload URL expires in 15 minutes. mimeType must be in the server allowlist.
  """
  getUploadUrl(fileName: String!, mimeType: String!, todoId: String!): UploadUrlResult

  """
  P5-W5: Get a presigned GET URL for an existing attachment.
  Access granted to uploader, todo owner, and list members.
  Download URL expires in 1 hour.
  """
  getDownloadUrl(attachmentId: String!): DownloadUrlResult
}


# ── Queries ───────────────────────────────────────────────────────────────────

type Query {
  """
  List active sessions for the authenticated user (proxies hasura-auth).
  """
  listSessions: SessionsResult
}
