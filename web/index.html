<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(function () {
        try {
          var m = document.cookie.match(/(?:^|; )nself_theme=(dark|light)/)
          var v = (m && m[1]) || localStorage.getItem('nself_theme')
          var dark = v ? v === 'dark' : true
          if (m && m[1]) localStorage.setItem('nself_theme', m[1])
          else if (!v) localStorage.setItem('nself_theme', 'dark')
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
